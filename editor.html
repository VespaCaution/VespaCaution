<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site Builder</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --border: #e1e3ea;
    --text: #1d2230;
    --muted: #6a7183;
    --accent: #3d63dd;
    --accent-hover: #2f50bd;
    --canvas-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 220px 1fr 280px;
    grid-template-rows: 56px 1fr;
    height: 100vh;
  }
  /* Top bar */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .topbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .topbar .actions { display: flex; gap: 8px; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  button:hover { background: #f0f2f7; }
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: #b81f1f; border-color: #f0c7c7; }
  button.danger:hover { background: #fdf2f2; }

  /* Left palette */
  .palette {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
  }
  .palette h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 16px 0 8px;
  }
  .palette h2:first-child { margin-top: 0; }
  .palette-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    cursor: grab;
    user-select: none;
    font-size: 13px;
    background: #fafbff;
  }
  .palette-item:hover { background: #eef2ff; border-color: #c9d3f5; }
  .palette-item:active { cursor: grabbing; }
  .palette-item .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }

  /* Canvas area */
  .canvas-wrap {
    overflow-y: auto;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .canvas {
    width: 100%;
    max-width: 900px;
    min-height: calc(100vh - 120px);
    background: var(--canvas-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(20,30,60,.05);
    position: relative;
  }
  .canvas.drop-active {
    outline: 2px dashed var(--accent);
    outline-offset: -4px;
  }
  .block {
    position: relative;
    padding: 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    margin: 4px 0;
  }
  .block:hover { border-color: #c9d3f5; }
  .block.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(61,99,221,.15);
  }
  .block .block-tools {
    position: absolute;
    top: -10px;
    right: 8px;
    display: none;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .block.selected .block-tools { display: flex; }
  .block-tools button {
    padding: 2px 8px;
    font-size: 11px;
    border: none;
    background: transparent;
  }
  .block-tools button:hover { background: #f0f2f7; }
  .block-tools .del:hover { background: #fdf2f2; color: #b81f1f; }

  /* Block content styles */
  .block[data-type="text"] .text-input {
    width: 100%;
    border: none;
    resize: vertical;
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    outline: none;
    background: transparent;
    color: inherit;
    min-height: 60px;
  }
  .block[data-type="heading"] .heading-input {
    width: 100%;
    border: none;
    font: inherit;
    font-size: 32px;
    font-weight: 700;
    outline: none;
    background: transparent;
    color: inherit;
    padding: 0;
  }
  .block[data-type="image"] img {
    max-width: 100%;
    display: block;
    border-radius: 4px;
  }
  .block[data-type="image"] .empty-img {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .block[data-type="image"] .empty-img:hover { border-color: var(--accent); color: var(--accent); }
  .block[data-type="button"] { text-align: left; }
  .block[data-type="button"] a {
    display: inline-block;
    padding: 10px 20px;
    background: var(--accent);
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
  }
  .block[data-type="button"] a:hover { background: var(--accent-hover); }
  .block[data-type="divider"] hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 8px 0;
  }
  .block[data-type="spacer"] { height: 40px; }
  .block[data-type="file"] .file-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fafbff;
    text-decoration: none;
    color: var(--text);
    font-size: 13px;
  }
  .block[data-type="file"] .file-item:hover { background: #eef2ff; }

  /* Right inspector */
  .inspector {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    font-size: 13px;
  }
  .inspector h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field input[type="color"],
  .field select,
  .field textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    background: white;
    color: var(--text);
  }
  .field input[type="color"] { padding: 2px; height: 34px; cursor: pointer; }
  .field textarea { resize: vertical; min-height: 60px; }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 40px 12px;
  }
  .empty-state .hint { font-size: 12px; margin-top: 6px; }

  /* Hidden file input */
  #file-input { display: none; }
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <h1>🧱 Site Builder</h1>
    <div class="actions">
      <button id="btn-new" class="danger">New</button>
      <button id="btn-save-json">Save .json</button>
      <label style="display:inline-block;">
        <button id="btn-load-json" type="button">Load .json</button>
        <input type="file" id="load-json-input" accept=".json" style="display:none">
      </label>
      <button id="btn-export" class="primary">Export index.html</button>
    </div>
  </div>

  <!-- Palette -->
  <aside class="palette">
    <h2>Layout</h2>
    <div class="palette-item" draggable="true" data-type="heading"><span class="dot"></span> Heading</div>
    <div class="palette-item" draggable="true" data-type="text"><span class="dot"></span> Text</div>
    <div class="palette-item" draggable="true" data-type="image"><span class="dot"></span> Image</div>
    <div class="palette-item" draggable="true" data-type="button"><span class="dot"></span> Button</div>
    <div class="palette-item" draggable="true" data-type="file"><span class="dot"></span> File link</div>
    <div class="palette-item" draggable="true" data-type="divider"><span class="dot"></span> Divider</div>
    <div class="palette-item" draggable="true" data-type="spacer"><span class="dot"></span> Spacer</div>

    <h2>Page</h2>
    <div class="palette-item" style="cursor:default;" id="palette-page-bg">
      <span class="dot" style="background:#888"></span> Background color
    </div>
  </aside>

  <!-- Canvas -->
  <main class="canvas-wrap">
    <div class="canvas" id="canvas"></div>
  </main>

  <!-- Inspector -->
  <aside class="inspector" id="inspector">
    <div class="empty-state">
      Select a block to edit it.
      <div class="hint">Or edit page settings below.</div>
      <div style="margin-top:24px;text-align:left;">
        <div class="field">
          <label>Page title</label>
          <input type="text" id="page-title" placeholder="My site">
        </div>
        <div class="field">
          <label>Page background</label>
          <input type="color" id="page-bg" value="#ffffff">
        </div>
      </div>
    </div>
  </aside>

</div>

<input type="file" id="file-input" accept="image/*">
<script>
(function () {
  'use strict';

  // ---------- State ----------
  const state = {
    page: {
      title: 'My site',
      background: '#ffffff',
    },
    blocks: [],       // { id, type, props: {...} }
    selectedId: null,
  };
  let nextId = 1;
  const uid = () => 'b' + (nextId++);

  // ---------- DOM refs ----------
  const canvas = document.getElementById('canvas');
  const inspector = document.getElementById('inspector');
  const fileInput = document.getElementById('file-input');
  const pageTitleInput = document.getElementById('page-title');
  const pageBgInput = document.getElementById('page-bg');

  // ---------- Palette drag source ----------
  document.querySelectorAll('.palette-item[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', el.dataset.type);
      e.dataTransfer.effectAllowed = 'copy';
    });
  });

  // ---------- Canvas drop ----------
  canvas.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    canvas.classList.add('drop-active');
  });
  canvas.addEventListener('dragleave', () => canvas.classList.remove('drop-active'));
  canvas.addEventListener('drop', e => {
    e.preventDefault();
    canvas.classList.remove('drop-active');
    const type = e.dataTransfer.getData('text/plain');
    if (!type) return;

    const block = createBlock(type);
    // Insert at drop position based on mouse Y
    const blocks = Array.from(canvas.querySelectorAll('.block'));
    let insertAt = blocks.length;
    for (let i = 0; i < blocks.length; i++) {
      const r = blocks[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { insertAt = i; break; }
    }
    state.blocks.splice(insertAt, 0, block);
    render();
    select(block.id);
  });

  // ---------- Block factories ----------
  function createBlock(type) {
    const id = uid();
    const props = (() => {
      switch (type) {
        case 'heading': return { text: 'Heading', align: 'left' };
        case 'text':    return { text: 'Write something here...', align: 'left' };
        case 'image':   return { src: '', alt: '', width: '100%' };
        case 'button':  return { label: 'Click me', href: '#', newTab: false };
        case 'file':    return { label: 'Download file', href: '#', filename: '' };
        case 'divider': return {};
        case 'spacer':  return { height: 40 };
        default:        return {};
      }
    })();
    return { id, type, props };
  }

  // ---------- Render ----------
  function render() {
    canvas.style.background = state.page.background;
    canvas.innerHTML = '';

    if (state.blocks.length === 0) {
      const hint = document.createElement('div');
      hint.className = 'empty-state';
      hint.innerHTML = 'Drag a block from the left to start building.<br><span class="hint">Tip: drop between existing blocks to insert.</span>';
      canvas.appendChild(hint);
    }

    state.blocks.forEach((b, i) => {
      const el = renderBlock(b);
      el.dataset.id = b.id;
      el.classList.toggle('selected', b.id === state.selectedId);
      el.addEventListener('click', e => {
        if (e.target.closest('.block-tools')) return;
        select(b.id);
      });
      canvas.appendChild(el);
    });

    renderInspector();
  }

  function renderBlock(b) {
    const el = document.createElement('div');
    el.className = 'block';
    el.dataset.type = b.type;

    // Tools
    const tools = document.createElement('div');
    tools.className = 'block-tools';
    tools.innerHTML = `
      <button class="up" title="Move up">↑</button>
      <button class="down" title="Move down">↓</button>
      <button class="del" title="Delete">✕</button>
    `;
    el.appendChild(tools);

    tools.querySelector('.up').onclick = e => { e.stopPropagation(); move(b.id, -1); };
    tools.querySelector('.down').onclick = e => { e.stopPropagation(); move(b.id, +1); };
    tools.querySelector('.del').onclick = e => { e.stopPropagation(); remove(b.id); };

    // Content
    switch (b.type) {
      case 'heading': {
        const input = document.createElement('input');
        input.className = 'heading-input';
        input.value = b.props.text;
        input.style.textAlign = b.props.align || 'left';
        input.oninput = () => { b.props.text = input.value; renderInspector(); };
        el.appendChild(input);
        break;
      }
      case 'text': {
        const ta = document.createElement('textarea');
        ta.className = 'text-input';
        ta.value = b.props.text;
        ta.style.textAlign = b.props.align || 'left';
        ta.oninput = () => { b.props.text = ta.value; };
        el.appendChild(ta);
        break;
      }
      case 'image': {
        if (b.props.src) {
          const img = document.createElement('img');
          img.src = b.props.src;
          img.alt = b.props.alt || '';
          img.style.width = b.props.width || '100%';
          el.appendChild(img);
        } else {
          const empty = document.createElement('div');
          empty.className = 'empty-img';
          empty.textContent = 'Click to choose an image';
          empty.onclick = e => { e.stopPropagation(); pickImage(b.id); };
          el.appendChild(empty);
        }
        break;
      }
      case 'button': {
        const a = document.createElement('a');
        a.textContent = b.props.label;
        a.href = b.props.href || '#';
        a.onclick = e => e.preventDefault();
        if (b.props.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
        el.appendChild(a);
        break;
      }
      case 'file': {
        const a = document.createElement('a');
        a.className = 'file-item';
        a.href = b.props.href || '#';
        a.onclick = e => e.preventDefault();
        a.innerHTML = `📎 <span>${escapeHtml(b.props.label || 'Download file')}</span>`;
        el.appendChild(a);
        break;
      }
      case 'divider': {
        const hr = document.createElement('hr');
        el.appendChild(hr);
        break;
      }
      case 'spacer': {
        el.style.height = (b.props.height || 40) + 'px';
        break;
      }
    }

    return el;
  }

  // ---------- Inspector ----------
  function renderInspector() {
    const b = state.blocks.find(x => x.id === state.selectedId);

    if (!b) {
      inspector.innerHTML = `
        <div class="empty-state">
          Select a block to edit it.
          <div class="hint">Or edit page settings below.</div>
          <div style="margin-top:24px;text-align:left;">
            <div class="field">
              <label>Page title</label>
              <input type="text" id="page-title" value="${escapeAttr(state.page.title)}">
            </div>
            <div class="field">
              <label>Page background</label>
              <input type="color" id="page-bg" value="${escapeAttr(state.page.background)}">
            </div>
          </div>
        </div>`;
      bindPageFields();
      return;
    }

    inspector.innerHTML = `
      <h2>${b.type} block</h2>
      <div id="block-fields"></div>
      <div style="margin-top:20px;display:flex;gap:8px;">
        <button id="insp-duplicate">Duplicate</button>
        <button id="insp-delete" class="danger">Delete</button>
      </div>
    `;

    document.getElementById('insp-duplicate').onclick = () => duplicate(b.id);
    document.getElementById('insp-delete').onclick = () => remove(b.id);

    const fields = document.getElementById('block-fields');
    const addField = (label, inputEl) => {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const lab = document.createElement('label');
      lab.textContent = label;
      wrap.appendChild(lab);
      wrap.appendChild(inputEl);
      fields.appendChild(wrap);
    };

    // Common per-type fields
    if (b.type === 'heading' || b.type === 'text') {
      const ta = document.createElement('textarea');
      ta.value = b.props.text;
      ta.oninput = () => { b.props.text = ta.value; render(); };
      addField('Text', ta);

      const sel = document.createElement('select');
      sel.innerHTML = `<option value="left">Left</option><option value="center">Center</option><option value="right">Right</option>`;
      sel.value = b.props.align || 'left';
      sel.onchange = () => { b.props.align = sel.value; render(); };
      addField('Alignment', sel);
    }

    if (b.type === 'image') {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      wrap.innerHTML = `<label>Image</label>`;
      const btn = document.createElement('button');
      btn.textContent = 'Choose image…';
      btn.onclick = () => pickImage(b.id);
      wrap.appendChild(btn);
      fields.appendChild(wrap);

      const alt = document.createElement('input');
      alt.type = 'text';
      alt.value = b.props.alt || '';
      alt.oninput = () => { b.props.alt = alt.value; render(); };
      addField('Alt text', alt);

      const w = document.createElement('input');
      w.type = 'text';
      w.value = b.props.width || '100%';
      w.oninput = () => { b.props.width = w.value; render(); };
      addField('Width (e.g. 100%, 300px)', w);

      if (b.props.src) {
        const rm = document.createElement('button');
        rm.textContent = 'Remove image';
        rm.className = 'danger';
        rm.onclick = () => { b.props.src = ''; render(); };
        const wrap2 = document.createElement('div');
        wrap2.className = 'field';
        wrap2.appendChild(rm);
        fields.appendChild(wrap2);
      }
    }

    if (b.type === 'button') {
      const lbl = document.createElement('input');
      lbl.type = 'text';
      lbl.value = b.props.label;
      lbl.oninput = () => { b.props.label = lbl.value; render(); };
      addField('Label', lbl);

      const href = document.createElement('input');
      href.type = 'text';
      href.value = b.props.href || '';
      href.placeholder = 'https://… or page.html or #section';
      href.oninput = () => { b.props.href = href.value; render(); };
      addField('Link URL', href);

      const nt = document.createElement('input');
      nt.type = 'checkbox';
      nt.checked = !!b.props.newTab;
      nt.onchange = () => { b.props.newTab = nt.checked; render(); };
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const lab = document.createElement('label');
      lab.style.display = 'flex';
      lab.style.alignItems = 'center';
      lab.style.gap = '6px';
      lab.style.cursor = 'pointer';
      lab.appendChild(nt);
      lab.appendChild(document.createTextNode('Open in new tab'));
      wrap.appendChild(lab);
      fields.appendChild(wrap);
    }

    if (b.type === 'file') {
      const lbl = document.createElement('input');
      lbl.type = 'text';
      lbl.value = b.props.label || '';
      lbl.oninput = () => { b.props.label = lbl.value; render(); };
      addField('Label', lbl);

      const href = document.createElement('input');
      href.type = 'text';
      href.value = b.props.href || '';
      href.placeholder = 'https://… or page.html or #section';
      href.oninput = () => { b.props.href = href.value; render(); };
      addField('Link URL', href);

      const nt = document.createElement('input');
      nt.type = 'checkbox';
      nt.checked = !!b.props.newTab;
      nt.onchange = () => { b.props.newTab = nt.checked; render(); };
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const lab = document.createElement('label');
      lab.style.display = 'flex';
      lab.style.alignItems = 'center';
      lab.style.gap = '6px';
      lab.style.cursor = 'pointer';
      lab.appendChild(nt);
      lab.appendChild(document.createTextNode('Open in new tab'));
      wrap.appendChild(lab);
      fields.appendChild(wrap);
    }

    if (b.type === 'file') {
      const lbl = document.createElement('input');
      lbl.type = 'text';
      lbl.value = b.props.label || '';
      lbl.oninput = () => { b.props.label = lbl.value; render(); };
      addField('Label', lbl);

      const href = document.createElement('input');
      href.type = 'text';
      href.value = b.props.href || '';
      href.placeholder = 'files/guide.pdf or https://…';
      href.oninput = () => { b.props.href = href.value; render(); };
      addField('File URL', href);

      const note = document.createElement('div');
      note.className = 'hint';
      note.style.fontSize = '12px';
      note.style.color = 'var(--muted)';
      note.textContent = 'Tip: put the file next to index.html (e.g. in files/) and use that path.';
      fields.appendChild(note);
    }

    if (b.type === 'spacer') {
      const h = document.createElement('input');
      h.type = 'number';
      h.value = b.props.height || 40;
      h.oninput = () => { b.props.height = Math.max(0, Number(h.value) || 0); render(); };
      addField('Height (px)', h);
    }
  }

  function bindPageFields() {
    const titleEl = document.getElementById('page-title');
    const bgEl = document.getElementById('page-bg');
    if (titleEl) titleEl.oninput = () => { state.page.title = titleEl.value; };
    if (bgEl) bgEl.oninput = () => { state.page.background = bgEl.value; render(); };
  }

  // ---------- Actions ----------
  function select(id) {
    state.selectedId = id;
    render();
  }

  function move(id, dir) {
    const i = state.blocks.findIndex(b => b.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= state.blocks.length) return;
    [state.blocks[i], state.blocks[j]] = [state.blocks[j], state.blocks[i]];
    render();
  }

  function remove(id) {
    state.blocks = state.blocks.filter(b => b.id !== id);
    if (state.selectedId === id) state.selectedId = null;
    render();
  }

  function duplicate(id) {
    const b = state.blocks.find(x => x.id === id);
    if (!b) return;
    const copy = JSON.parse(JSON.stringify(b));
    copy.id = uid();
    const i = state.blocks.findIndex(x => x.id === id);
    state.blocks.splice(i + 1, 0, copy);
    select(copy.id);
  }

  function pickImage(id) {
    state.pendingImageFor = id;
    fileInput.value = '';
    fileInput.click();
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const b = state.blocks.find(x => x.id === state.pendingImageFor);
      if (!b) return;
      b.props.src = reader.result; // data URL, embeds directly into exported HTML
      render();
    };
    reader.readAsDataURL(file);
  });

  // ---------- Topbar actions ----------
  document.getElementById('btn-new').onclick = () => {
    if (state.blocks.length && !confirm('Discard current work?')) return;
    state.blocks = [];
    state.selectedId = null;
    state.page = { title: 'My site', background: '#ffffff' };
    render();
  };

  document.getElementById('btn-save-json').onclick = () => {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'site.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  const loadInput = document.getElementById('load-json-input');
  document.getElementById('btn-load-json').onclick = () => loadInput.click();
  loadInput.addEventListener('change', () => {
    const file = loadInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.blocks) throw new Error('Invalid file');
        state.page = data.page || { title: 'My site', background: '#ffffff' };
        state.blocks = data.blocks;
        state.selectedId = null;
        // Recompute nextId to avoid collisions
        nextId = 1;
        state.blocks.forEach(b => {
          const m = /^b(\d+)$/.exec(b.id || '');
          if (m) nextId = Math.max(nextId, Number(m[1]) + 1);
        });
        render();
      } catch (err) {
        alert('Could not load file: ' + err.message);
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('btn-export').onclick = () => {
    const html = buildExportHtml();
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // ---------- Exporter ----------
  function buildExportHtml() {
    const blocksHtml = state.blocks.map(exportBlock).join('\n');

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(state.page.title)}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #1d2230;
    background: ${state.page.background};
    line-height: 1.5;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  h1, h2, h3 { margin: 0 0 12px; line-height: 1.2; }
  p { margin: 0 0 12px; }
  img { max-width: 100%; display: block; border-radius: 6px; }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    background: #3d63dd;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
  }
  .btn:hover { background: #2f50bd; }
  .file-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid #e1e3ea;
    border-radius: 6px;
    background: #fafbff;
    text-decoration: none;
    color: #1d2230;
    font-size: 14px;
  }
  .file-link:hover { background: #eef2ff; }
  hr { border: none; border-top: 1px solid #e1e3ea; margin: 16px 0; }
  .spacer { display: block; }
</style>
</head>
<body>
<main>
${blocksHtml}
</main>
</body>
</html>`;
  }

  function exportBlock(b) {
    const p = b.props || {};
    const align = p.align ? ` style="text-align:${p.align}"` : '';
    switch (b.type) {
      case 'heading':
        return `<h1${align}>${escapeHtml(p.text || '')}</h1>`;
      case 'text':
        return `<p${align}>${escapeHtml(p.text || '').replace(/\n/g, '<br>')}</p>`;
      case 'image':
        if (!p.src) return '';
        return `<img src="${escapeAttr(p.src)}" alt="${escapeAttr(p.alt || '')}"${p.width ? ` style="width:${escapeAttr(p.width)}"` : ''}>`;
      case 'button': {
        const target = p.newTab ? ' target="_blank" rel="noopener"' : '';
        return `<a class="btn" href="${escapeAttr(p.href || '#')}"${target}>${escapeHtml(p.label || 'Button')}</a>`;
      }
      case 'file':
        return `<a class="file-link" href="${escapeAttr(p.href || '#')}">📎 <span>${escapeHtml(p.label || 'Download')}</span></a>`;
      case 'divider':
        return `<hr>`;
      case 'spacer':
        return `<div class="spacer" style="height:${Number(p.height) || 40}px"></div>`;
      default:
        return '';
    }
  }

  // ---------- Utilities ----------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ---------- Boot ----------
  render();
})();
</script>
</body>
</html>
