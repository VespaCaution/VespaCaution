    <style>
        :root {
            --bg-color: #fcf9f2;
            --surface: #f4ebd9;
            --primary: #d35400;
            --primary-hover: #e67e22;
            --text-main: #5c4a3d;
            --text-muted: #8c7a6b;
            --white: #ffffff;
            --border: #e8dfce;
            --success: #27ae60;
            --danger: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        
        /* Compact Header */
        header {
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 15px;
            min-height: 60px;
            flex-wrap: wrap;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        
        .logo-container { display: flex; align-items: center; text-decoration: none; }
        .logo-container img { height: 50px; width: auto; max-width: 280px; object-fit: contain; mix-blend-mode: multiply; }

        /* Language Selector */
        .lang-selector {
            display: flex; gap: 4px; font-size: 0.8rem; background: var(--white); padding: 3px; border-radius: 20px; border: 1px solid var(--border);
        }
        .lang-btn { background: transparent; border: none; cursor: pointer; padding: 2px 6px; border-radius: 12px; color: var(--text-muted); font-weight: bold; }
        .lang-btn.active { background: var(--primary); color: var(--white); }

        /* Navigation */
        nav { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
        nav a { text-decoration: none; color: var(--text-main); font-weight: 600; transition: color 0.2s; }
        nav a:hover { color: var(--primary); }
        
        /* ICÔNES SOCIALES */
        .social-icons { display: flex; gap: 10px; margin-left: 10px; align-items: center; }
        .social-icons img { height: 24px; width: 24px; cursor: pointer; transition: transform 0.2s; object-fit: contain; }
        .social-icons img:hover { transform: scale(1.1); }

        /* Main Content */
        main { max-width: 900px; margin: 30px auto; padding: 0 15px; min-height: 70vh; }
        h1, h2, h3 { color: var(--primary); margin-bottom: 10px; }
        h1 { font-size: 2rem; }
        
        /* App Cards */
        .app-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .app-card {
            background: var(--surface); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border); transition: transform 0.2s; display: flex; flex-direction: column;
        }
        .app-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        .app-card h3 { margin-bottom: 10px; font-size: 1.3rem; color: var(--text-main); }
        .app-card p { flex-grow: 1; margin-bottom: 15px; font-size: 0.95rem; }
        
        .btn {
            display: inline-block; background: var(--primary); color: var(--white); padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; text-align: center; border: none; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }

        /* App Details & Instructions */
        .app-details { background: var(--surface); padding: 25px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
        .app-details p, .app-details li { margin-bottom: 10px; color: var(--text-main); }
        .app-details ul { margin-left: 20px; margin-bottom: 20px; }
        .app-details h3 { margin-top: 20px; font-size: 1.2rem; }

        /* Accordion (Collapsible Instructions) */
        .accordion { background: var(--white); border: 1px solid var(--border); border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .accordion-header {
            background: var(--primary); color: var(--white); padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
        }
        .accordion-header:hover { background: var(--primary-hover); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding: 0 20px; }
        .accordion-content.active { max-height: 5000px; padding: 20px; border-top: 1px solid var(--border); }
        .accordion-content img { width: 100%; max-width: 400px; display: block; margin: 15px auto; border-radius: 10px; border: 1px solid var(--border); }
        
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 20px; border-radius: 10px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .account-notice { background: #fff3cd; color: #856404; padding: 15px; border-radius: 10px; border: 1px solid #ffeeba; margin-top: 20px; font-weight: bold; }
        .account-notice.yes { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }

        /* Forms & Footer */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--white); color: var(--text-main); }
        .form-group textarea { min-height: 120px; resize: vertical; }
        
        footer { background: var(--surface); border-top: 2px solid var(--border); padding: 30px 15px; margin-top: 40px; }
        footer a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .footer-content { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .footer-bottom { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted); }

        .alert { padding: 15px; margin-bottom: 20px; border-radius: 10px; text-align: center; font-weight: bold;}
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 650px) {
            header { flex-direction: column; gap: 10px; padding: 10px; }
            .header-left { width: 100%; justify-content: space-between; }
            nav { justify-content: center; width: 100%; }
        }
    </style>
</head>

                    it: function() { return `<div class="app-details"><h1>AlvearCheck v1.0</h1><p><strong>Un account è obbligatorio</strong>.</p><a href="./alvearcheck/index.html" class="btn">${t('btn_open')} AlvearCheck</a>
                    <div class="accordion">
                        <div class="accordion-header" onclick="toggleAccordion(this)">${t('btn_instructions')} <span>+</span></div>
                        <div class="accordion-content">
                            <h3>1. Account e Apiari</h3><p>Accedi e crea un apiario con GPS.</p><img src="./alvearcheck/1.png" alt="Login">
                            <h3>2. Arnie e IA</h3><p>Usa il microfono IA per dettare.</p><img src="./alvearcheck/2.png" alt="Arnie">
                            <div class="video-container"><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe></div>
                            <div class="account-notice yes">${t('need_account_yes')}</div>
                            <div style="margin-top:20px; display:flex; gap:10px;"><a href="#contact" class="btn">${t('contact_me')}</a><a href="#privacy" class="btn" style="background:var(--text-muted);">${t('privacy_link')}</a></div>
                        </div>
                    </div></div>`; },
                    rm: function() { return `<div class="app-details"><h1>AlvearCheck v1.0</h1><p><strong>In conto è obligatoric</strong>.</p><a href="./alvearcheck/index.html" class="btn">${t('btn_open')} AlvearCheck</a>
                    <div class="accordion">
                        <div class="accordion-header" onclick="toggleAccordion(this)">${t('btn_instructions')} <span>+</span></div>
                        <div class="accordion-content">
                            <h3>1. Conto ed Apiaris</h3><p>S'annunzia e crea in apiari.</p><img src="./alvearcheck/1.png" alt="Login">
                            <h3>2. Avieuls ed IA</h3><p>Duvra il microfon IA.</p><img src="./alvearcheck/2.png" alt="Avieuls">
                            <div class="video-container"><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe></div>
                            <div class="account-notice yes">${t('need_account_yes')}</div>
                            <div style="margin-top:20px; display:flex; gap:10px;"><a href="#contact" class="btn">${t('contact_me')}</a><a href="#privacy" class="btn" style="background:var(--text-muted);">${t('privacy_link')}</a></div>
                        </div>
                    </div></div>`; }
                }
            }
        };

        // ==========================================
        // 3. PAGE TEMPLATES
        // ==========================================
        
        const getHomeHtml = () => `
            <h1>${t('home_title')}</h1>
            <p style="font-size: 1.1rem; margin-bottom: 15px;">${t('home_desc1')}</p>
            <p style="margin-bottom: 30px;">${t('home_desc2')}</p>
            <h2 id="apps" style="margin-top: 30px;">${t('home_my_apps')}</h2>
            <div class="app-grid">
                ${Object.keys(appsConfig).map(key => `
                    <div class="app-card">
                        <h3>${appsConfig[key].icon} ${appsConfig[key].title}</h3>
                        <p>${appsConfig[key].shortDesc[currentLang]}</p>
                        <a href="#${key}" class="btn">${t('btn_view')}</a>
                    </div>
                `).join('')}
            </div>
        `;

        const getResourcesHtml = () => `
            <h1>${t('res_title')}</h1>
            <p>${t('res_desc')}</p>
            <div class="app-details" style="margin-top: 20px;">
                <h3>${t('res_swiss')}</h3>
                <a href="https://frelonasiatique.ch" target="_blank" class="resource-link"><strong>frelonasiatique.ch</strong><span>${t('link_frelon')}</span></a>
                <a href="https://stopfrelons.ch" target="_blank" class="resource-link"><strong>stopfrelons.ch</strong><span>${t('link_stop')}</span></a>
                <a href="https://abeilles.ch" target="_blank" class="resource-link"><strong>abeilles.ch</strong><span>${t('link_abeilles')}</span></a>
                <a href="https://melizoe.ch" target="_blank" class="resource-link"><strong>melizoe.ch</strong><span>${t('link_melizoe')}</span></a>
            </div>
            <div class="app-details" style="margin-top: 20px;">
                <h3>${t('res_credits')}</h3>
                <ul>
                    <li><strong>${t('res_creator')}</strong> Ben Hupka</li>
                    <li><strong>${t('res_video')}</strong> Grégoire Hupka</li>
                    <li><strong>${t('res_code')}</strong> DeepSeek AI</li>
                    <li><strong>${t('res_base')}</strong> ${t('credit_sar')}</li>
                </ul>
            </div>
        `;

        const getSupportHtml = () => `
            <h1 id="support">${t('support_title')}</h1>
            <div class="app-details" style="margin-top: 20px; text-align: center;">
                <p style="font-size: 1.2rem; margin-bottom: 20px;">${t('support_desc')}</p>
                <div style="font-size: 2rem; font-weight: bold; color: var(--primary); letter-spacing: 2px;">📱 079 938 41 98</div>
            </div>
        `;

        const getContactHtml = () => `
            <h1 id="contact">${t('contact_title')}</h1>
            <p>${t('contact_desc')}</p>
            <div class="app-details" style="margin-top: 20px;">
                <form id="contactForm">
                    <input type="hidden" name="access_key" value="c62ff1e0-99f0-4191-8264-6b540925caf3">
                    <div class="form-group"><label>${t('contact_name')}</label><input type="text" name="name" required></div>
                    <div class="form-group"><label>${t('contact_email')}</label><input type="email" name="email" required></div>
                    <div class="form-group"><label>${t('contact_app')}</label><select name="app"><option value="General">${t('contact_general')}</option>${Object.keys(appsConfig).map(key => `<option value="${appsConfig[key].title}">${appsConfig[key].title}</option>`).join('')}</select></div>
                    <div class="form-group"><label>${t('contact_type')}</label><select name="type"><option value="Question">${t('contact_opt_q')}</option><option value="Bug Report">${t('contact_opt_bug')}</option><option value="Feature Request">${t('contact_opt_feat')}</option><option value="Other">${t('contact_opt_other')}</option></select></div>
                    <div class="form-group"><label>${t('contact_msg')}</label><textarea name="message" required></textarea></div>
                    <button type="submit" class="btn" id="submitBtn">${t('contact_send')}</button>
                    <p id="formStatus" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
                </form>
            </div>
        `;

        const getPrivacyHtml = () => `
            <h1>${t('privacy_title')}</h1>
            <div class="app-details" style="margin-top: 20px;">
                <p><strong>${t('privacy_date')}</strong> ${new Date().toLocaleDateString(currentLang)}</p>
                <p>${t('privacy_p1')}</p>
                <h3>${t('privacy_h1')}</h3><p>${t('privacy_t1')}</p>
                <h3>${t('privacy_h2')}</h3><p>${t('privacy_t2')}</p>
                <h3>${t('privacy_h3')}</h3><p>${t('privacy_t3')}</p>
                <h3>${t('privacy_h4')}</h3><p>${t('privacy_t4')}</p>
                <h3>${t('privacy_h5')}</h3><p>${t('privacy_t5')}</p>
                <h3>${t('privacy_h6')}</h3><p>${t('privacy_t6')}</p>
                <h3>${t('privacy_h7')}</h3><p>${t('privacy_t7')}</p>
            </div>
        `;

        // ==========================================
        // 4. ROUTING LOGIC & ACCORDION
        // ==========================================
        const mainContent = document.getElementById('app-content');

        function toggleAccordion(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('span');
            if (content.classList.contains('active')) {
                content.classList.remove('active');
                icon.textContent = '+';
            } else {
                content.classList.add('active');
                icon.textContent = '-';
            }
        }

        function render() {
            const hash = window.location.hash.replace('#', '') || 'home';
            window.scrollTo(0, 0);

            if (appsConfig[hash]) {
                mainContent.innerHTML = appsConfig[hash].html[currentLang]();
            } else if (hash === 'apps') {
                mainContent.innerHTML = getHomeHtml();
                const el = document.getElementById('apps');
                if(el) el.scrollIntoView();
            } else if (hash === 'resources') {
                mainContent.innerHTML = getResourcesHtml();
            } else if (hash === 'support') {
                mainContent.innerHTML = getSupportHtml();
            } else if (hash === 'contact') {
                mainContent.innerHTML = getContactHtml();
                setupContactForm();
            } else if (hash === 'privacy') {
                mainContent.innerHTML = getPrivacyHtml();
            } else {
                mainContent.innerHTML = getHomeHtml();
            }
        }

        // ==========================================
        // 5. CONTACT FORM LOGIC
        // ==========================================
        function setupContactForm() {
            const form = document.getElementById('contactForm');
            if (!form) return;
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const submitBtn = document.getElementById('submitBtn');
                const status = document.getElementById('formStatus');
                const formData = new FormData(form);
                submitBtn.textContent = t('contact_sending');
                submitBtn.disabled = true;
                status.className = '';
                status.textContent = '';
                try {
                    const response = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (data.success) {
                        status.className = 'alert alert-success';
                        status.textContent = t('contact_success');
                        form.reset();
                    } else {
                        status.className = 'alert alert-error';
                        status.textContent = t('contact_error');
                    }
                } catch (error) {
                    status.className = 'alert alert-error';
                    status.textContent = t('contact_error');
                } finally {
                    submitBtn.textContent = t('contact_send');
                    submitBtn.disabled = false;
                }
            });
        }

        window.addEventListener('hashchange', render);
        setLanguage('fr');
    </script>
</body>
</html>
