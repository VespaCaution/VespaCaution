<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlvearCheck v1.0</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fbf6e8; color: #2e241b; padding: 1rem; min-height: 100vh; display: flex; justify-content: center; }
    .app { max-width: 1000px; width: 100%; background: #fffdf7; border-radius: 2rem; padding: 1.8rem; border: 1px solid #f0e3cf; }
    .app-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    h1 { display: flex; align-items: center; gap: 0.6rem; font-size: 2.2rem; font-weight: 600; color: #c47b2e; }
    h1 small { font-size: 0.9rem; font-weight: 400; color: #b0967a; margin-left: auto; background: #f3ebdd; padding: 0.2rem 0.8rem; border-radius: 20px; }
    .subhead { color: #7a6a58; margin-bottom: 1.8rem; font-size: 1rem; border-left: 4px solid #e3b87c; padding-left: 1rem; }
    button { background: #e8d9c4; border: none; padding: 0.6rem 1.2rem; border-radius: 40px; font-weight: 500; font-size: 0.9rem; color: #3d2e1f; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; }
    button.primary { background: #c47b2e; color: white; font-weight: 600; padding: 0.7rem 1.8rem; }
    button.danger { background: #f4e2dc; color: #a14d3a; }
    button.small { padding: 0.3rem 0.9rem; font-size: 0.8rem; }
    button.outline { background: transparent; border: 1px solid #d9c9b6; }
    .apiary-grid { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.2rem; }
    .apiary-card { background: #fcf8f0; border-radius: 1.5rem; padding: 1.2rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border: 1px solid #eee0cf; cursor: pointer; }
    .apiary-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .apiary-name { font-weight: 600; font-size: 1.2rem; }
    .apiary-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.85rem; color: #8b7b68; }
    #authScreen { max-width: 400px; margin: 10vh auto; padding: 2rem; background: #fffdf7; border-radius: 2rem; text-align: center; border: 1px solid #f0e3cf; }
    #authScreen input { margin-bottom: 1rem; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
    #errorBox { display: none; background: #ffcccc; color: red; padding: 15px; border: 2px solid red; margin-bottom: 20px; font-weight: bold; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="errorBox"></div>

  <div id="authScreen">
    <h2>🐝 AlvearCheck</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" class="primary" style="width: 100%; margin-bottom: 0.5rem;">Log In</button>
    <button id="registerBtn" class="outline" style="width: 100%;">Register</button>
    <p id="msg" style="margin-top: 1rem; font-weight: bold;"></p>
  </div>

  <div class="app" id="app" style="display:none;"></div>

  <script>
    // Catch any crashes and show them on screen
    window.onerror = function(msg, url, line) {
      var box = document.getElementById('errorBox');
      box.style.display = 'block';
      box.innerHTML += "CRASH: " + msg + "<br>Line: " + line + "<br><br>";
    };

    var supabase = window.supabase.createClient('https://hdhoctahsnqlvqsmwrsf.supabase.co', 'sb_publishable_Ydpj5A6_qxPfX2EcDM8Ogw_J1-t3Z8D');

    var appData = { apiaries: [] };
    var currentView = 'apiary-list';
    var activeApiaryId = null;

    // --- LOGIN & REGISTER ---
    document.getElementById('loginBtn').onclick = async function() {
      var email = document.getElementById('email').value;
      var pass = document.getElementById('password').value;
      var msg = document.getElementById('msg');
      msg.innerText = "Connecting...";
      
      var result = await supabase.auth.signInWithPassword({ email: email, password: pass });
      
      if (result.error) {
        msg.innerText = "Error: " + result.error.message;
        msg.style.color = "red";
      } else {
        msg.innerText = "Success! Loading app...";
        msg.style.color = "green";
        showApp(); // <--- THIS FIXES THE CRASH
      }
    };

    document.getElementById('registerBtn').onclick = async function() {
      var email = document.getElementById('email').value;
      var pass = document.getElementById('password').value;
      var msg = document.getElementById('msg');
      msg.innerText = "Creating...";
      
      var result = await supabase.auth.signUp({ email: email, password: pass });
      
      if (result.error) {
        msg.innerText = "Error: " + result.error.message;
        msg.style.color = "red";
      } else {
        msg.innerText = "Account created! Now click Log In.";
        msg.style.color = "green";
      }
    };

    // --- SHOW APP ---
    async function showApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      
      try {
        var userResult = await supabase.auth.getUser();
        if (userResult.data.user) {
           var dbResult = await supabase.from('user_data').select('data').eq('user_id', userResult.data.user.id).single();
           if (dbResult.data && dbResult.data.data) {
             appData = dbResult.data.data;
           }
        }
      } catch (err) { console.error(err); }
      
      render(); // Load the UI now that user is logged in
    }

    async function saveData(data) {
      appData = data;
      var userResult = await supabase.auth.getUser();
      if (userResult.data.user) {
        await supabase.from('user_data').upsert({ user_id: userResult.data.user.id, data: data, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
      }
    }

    // --- RENDER APIARY LIST ---
    function renderApiaryList() {
      var appEl = document.getElementById('app');
      var apiaries = appData.apiaries;
      
      var html = `<div class="app-header"><h1>🐝 AlvearCheck <small>v1.0</small></h1></div><div class="subhead">Manage your apiaries</div><div style="display:flex;justify-content:space-between;margin-bottom:1rem;"><span>${apiaries.length} apiaries</span><div><button class="primary" id="addApiaryBtn">＋ Add apiary</button></div></div>`;
      
      if (apiaries.length === 0) {
        html += `<div style="text-align:center; padding:2rem;">No apiaries yet.</div>`;
      } else {
        html += `<div class="apiary-grid">`;
        apiaries.forEach(function(apiary) {
          html += `<div class="apiary-card" data-apiary-id="${apiary.id}"><div class="apiary-info"><span class="apiary-name">${apiary.name}</span><div class="apiary-meta"><span>🧭 ${apiary.orientation || '—'}</span><span>📍 ${apiary.coordinates || '—'}</span><span>🐝 ${apiary.hives.length} hives</span></div></div><div><button class="small danger delete-apiary-btn" data-apiary-id="${apiary.id}">✕ Delete</button></div></div>`;
        });
        html += `</div>`;
      }
      
      appEl.innerHTML = html;
      
      // Attach listeners ONLY after the HTML is created
      document.getElementById('addApiaryBtn').onclick = function() {
        var name = prompt("Apiary Name:");
        if (name) {
          appData.apiaries.push({ id: Date.now().toString(), name: name, orientation: '', coordinates: '', hives: [] });
          saveData(appData);
          renderApiaryList();
        }
      };
      
      document.querySelectorAll('.apiary-card').forEach(function(card) {
        card.onclick = function(e) {
          if (e.target.closest('button')) return;
          activeApiaryId = card.dataset.apiaryId;
          // We will add hive rendering later, for now just show an alert
          alert("Clicked apiary: " + activeApiaryId + ". Hive list coming next!");
        };
      });

      document.querySelectorAll('.delete-apiary-btn').forEach(function(btn) {
        btn.onclick = function(e) {
          e.stopPropagation();
          if(confirm("Delete this apiary?")) {
            appData.apiaries = appData.apiaries.filter(function(a) { return a.id !== btn.dataset.apiaryId; });
            saveData(appData);
            renderApiaryList();
          }
        };
      });
    }

    function render() {
      if (currentView === 'apiary-list') renderApiaryList();
    }
  </script>
</body>
</html>
