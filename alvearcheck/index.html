    .app { max-width: 1000px; width: 100%; background: #fffdf7; border-radius: 2rem; box-shadow: 0 12px 30px rgba(0,0,0,0.08); padding: 1.8rem; border: 1px solid #f0e3cf; position: relative; }
    .app-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    h1 { display: flex; align-items: center; gap: 0.6rem; font-size: 2.2rem; font-weight: 600; color: #c47b2e; }
    h1 small { font-size: 0.9rem; font-weight: 400; color: #b0967a; margin-left: auto; background: #f3ebdd; padding: 0.2rem 0.8rem; border-radius: 20px; }
    .lang-selector { margin-left: auto; display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .lang-btn { background: transparent; border: 1px solid #d9c9b6; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.7rem; cursor: pointer; font-weight: 600; color: #7a6a58; }
    .lang-btn.active { background: #c47b2e; color: white; border-color: #c47b2e; }
    .subhead { color: #7a6a58; margin-bottom: 1.8rem; font-size: 1rem; border-left: 4px solid #e3b87c; padding-left: 1rem; }
    button { background: #e8d9c4; border: none; padding: 0.6rem 1.2rem; border-radius: 40px; font-weight: 500; font-size: 0.9rem; color: #3d2e1f; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; }
    button.primary { background: #c47b2e; color: white; font-weight: 600; padding: 0.7rem 1.8rem; }
    button.danger { background: #f4e2dc; color: #a14d3a; }
    button.small { padding: 0.3rem 0.9rem; font-size: 0.8rem; }
    button.outline { background: transparent; border: 1px solid #d9c9b6; }
    button.voice-btn { background: #f0e4d4; border-radius: 50%; width: 48px; height: 48px; padding: 0; position: fixed; bottom: 2rem; right: 2rem; z-index: 100; font-size: 1.4rem; }
    button.voice-btn.active { background: #c47b2e; color: white; }
    .apiary-grid { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.2rem; }
    .apiary-card { background: #fcf8f0; border-radius: 1.5rem; padding: 1.2rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border: 1px solid #eee0cf; cursor: pointer; }
    .apiary-card.has-swarm-risk { border-left: 6px solid #e6a017; background: #fdf8e8; }
    .apiary-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .apiary-name { font-weight: 600; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .apiary-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.85rem; color: #8b7b68; }
    .hive-list { display: flex; flex-direction: column; gap: 0.8rem; margin: 1rem 0 1.5rem; }
    .hive-card { background: #faf4ea; border-radius: 1.2rem; padding: 1rem 1.3rem; border-left: 6px solid #e3b87c; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; cursor: pointer; }
    .hive-card.swarm-warning { border-left-color: #e6a017; background: #fdf8e8; }
    .hive-name { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .queen-badge { font-size: 0.7rem; background: #f0e4d4; padding: 0.2rem 0.7rem; border-radius: 30px; font-weight: 600; }
    .swarm-alert-badge { background: #f5d9b0; color: #8a5c00; padding: 0.2rem 0.7rem; border-radius: 30px; font-size: 0.75rem; font-weight: 600; }
    .form-panel { background: #f9f3e9; border-radius: 1.5rem; padding: 1.8rem; margin-top: 1.8rem; border: 1px solid #e8d9c4; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; margin: 1rem 0 1.5rem; }
    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #7f6b56; }
    input, select, textarea { background: white; border: 1px solid #ddd0bd; border-radius: 14px; padding: 0.65rem 0.9rem; font-size: 0.9rem; width: 100%; }
    .checkbox-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.3rem; }
    .row-actions { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
    .back-link { background: none; border: none; color: #7a6a58; cursor: pointer; font-weight: 500; margin-bottom: 1rem; }
    .empty-state { text-align: center; padding: 2rem; color: #a18d77; background: #f8f1e6; border-radius: 2rem; font-style: italic; }
    .badge { background: #e8d9c4; padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
    .geo-btn { background: #e8d9c4; border: none; padding: 0.4rem 0.8rem; border-radius: 20px; font-weight: 600; cursor: pointer; }
    .visit-history-wrapper { margin-top: 1.5rem; border-radius: 1.2rem; border: 1px solid #e8d9c4; overflow: hidden; }
    .visit-history-header { background: #f0e4d4; padding: 0.8rem 1.2rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }

    .visit-table td { padding: 0.6rem; border-bottom: 1px solid #f0e8dc; }

    .voice-status.visible { display: block; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(46,36,27,0.45); z-index: 200; display: none; }
    .modal-backdrop.visible { display: block; }
    .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fffdf7; border-radius: 1.5rem; padding: 1.6rem; z-index: 201; max-width: 440px; width: 90%; display: none; }

        document.getElementById('app').style.display = 'none';

var mediaRecorder = null; 
var audioChunks = []; 
var isRecording = false; 
var audioContext = null; 
var analyser = null; 
var streamRef = null;

function showVoiceStatus(msg, time) { 
  if (!time) time = 5000; 
  var el = document.getElementById('voiceStatus'); 
  el.textContent = msg; 
  el.classList.add('visible'); 
  clearTimeout(el._timeout); 
  el._timeout = setTimeout(function() { el.classList.remove('visible'); }, time); 
}

async function startHandsFreeDictation() { 
  var btn = document.getElementById('voiceBtn'); 
  if (isRecording) { stopDictation(); btn.classList.remove('active'); showVoiceStatus("Dictation stopped."); return; } 
  btn.classList.add('active'); showVoiceStatus("🎙️ Listening... Speak now."); 
  try { 
    streamRef = await navigator.mediaDevices.getUserMedia({ audio: true }); 
    audioContext = new (window.AudioContext || window.webkitAudioContext)(); 
    var source = audioContext.createMediaStreamSource(streamRef); 
    analyser = audioContext.createAnalyser(); 
    analyser.fftSize = 512; 
    source.connect(analyser); 
    startRecordingChunk(); 
  } catch (err) { nativeAlert("Microphone access denied."); btn.classList.remove('active'); } 
}

function startRecordingChunk() { 
  if (!streamRef) return; 
  mediaRecorder = new MediaRecorder(streamRef); 
  audioChunks = []; 
  mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) audioChunks.push(e.data); }; 
  mediaRecorder.onstop = async function() { 
    var audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); 
    if (audioBlob.size > 1000) await processDictation(audioBlob); 
    if (isRecording) startRecordingChunk(); 
  }; 
  mediaRecorder.start(); 
  isRecording = true; 
  monitorSilence(); 
}

function monitorSilence() { 
  if (!analyser || !isRecording) return; 
  var dataArray = new Uint8Array(analyser.frequencyBinCount); 
  var silenceStart = Date.now(); 
  var hasSpoken = false; 
  function checkVolume() { 
    if (!isRecording || !mediaRecorder || mediaRecorder.state !== 'recording') return; 
    analyser.getByteFrequencyData(dataArray); 
    var sum = 0; 
    for (var i = 0; i < dataArray.length; i++) sum += dataArray[i]; 
    if ((sum / dataArray.length) > 15) { hasSpoken = true; silenceStart = Date.now(); } 
    if (hasSpoken && (Date.now() - silenceStart) > 2000) { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); return; } 
    requestAnimationFrame(checkVolume); 
  } 
  checkVolume(); 
}

function stopDictation() { 
  isRecording = false; 
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); 
  if (streamRef) streamRef.getTracks().forEach(function(t) { return t.stop(); }); 
  if (audioContext) audioContext.close(); 
}

async function processDictation(audioBlob) { 
  showVoiceStatus("🧠 Transcribing..."); 
  try { 
    var formData = new FormData(); 
    formData.append('file', audioBlob, 'audio.webm'); 
    var langCode = currentLang === 'fr' ? 'fr' : currentLang === 'de' ? 'de' : currentLang === 'it' ? 'it' : 'en'; 
    formData.append('language', langCode); 

    var sttResponse = await fetch('https://hdhoctahsnqlvqsmwrsf.supabase.co/functions/v1/groq-ai', { 
      method: 'POST', 
      headers: { 'Authorization': 'Bearer sb_publishable_Ydpj5A6_qxPfX2EcDM8Ogw_J1-t3Z8D' }, 
      body: formData 
    }); 
    if (!sttResponse.ok) throw new Error("STT API failed"); 
    var sttResult = await sttResponse.json(); 
    var transcript = sttResult.text; 
    if (!transcript || transcript.trim().length < 3) { showVoiceStatus("🎙️ Listening... (didn't catch that)"); return; }

async function screenReaderAI(transcript) {
  var text = transcript.toLowerCase();

  // ==========================================
  // 1. NAVIGATION VERS UN RUCHER OU UNE RUCHE PAR NOM
  // ==========================================
  if (text.includes('ouvre') || text.includes('ouvrir') || text.includes('open')) {
    if (currentView === 'apiary-list') {
      var apiary = appData.apiaries.find(function(a) { return text.includes(a.name.toLowerCase()); });
      if (apiary) {
        activeApiaryId = apiary.id;
        currentView = 'hive-list';
        render();
        showVoiceStatus("✅ Rucher ouvert : " + apiary.name);
        return;
      }
    }
    if (currentView === 'hive-list' && activeApiaryId) {
      var currentApiary = findApiary(activeApiaryId);
      var hive = currentApiary.hives.find(function(h) { return text.includes(h.name.toLowerCase()); });
      if (hive) {
        activeHiveId = hive.id;
        editHiveData = { name: hive.name, maleFrames: hive.maleFrames || '', honeyFrames: hive.honeyFrames || '', broodFrames: hive.broodFrames || '', swarmRisk: hive.swarmRisk, queenColor: hive.queenColor, varroaCount: hive.varroaCount || '', remarks: hive.remarks || '' };
        currentView = 'edit-hive';
        render();
        showVoiceStatus("✅ Ruche ouverte : " + hive.name);
        return;
      }
    }
  }

  // ==========================================
  // 2. GESTION DES BOUTONS (Sans IA)
  // ==========================================
  var actionMap = {
    'enregistr': 'saveHiveBtn', 'sauvegard': 'saveHiveBtn', 'valide': 'saveHiveBtn',
    'annul': 'cancelHiveBtn', 'retour': 'backToApiaries', 'revenir': 'backToApiaries',
    'visite': 'visit-history-btn', 'modifi': 'edit-hive-btn', 'ajout': 'addHiveBtn',
    'compte': 'accountBtn', 'déconnex': 'logoutBtn'
  };

  var foundId = null;
  for (var key in actionMap) {
    if (text.includes(key)) {
      foundId = actionMap[key];
      break;
    }
  }

  if (foundId) {
    if (foundId === 'visit-history-btn' && activeHiveId) {
      var btn = document.querySelector('.visit-history-btn[data-hive-id="' + activeHiveId + '"]');
      if (btn) { btn.click(); showVoiceStatus("✅ Visites ouvertes"); return; }
    }
    if (foundId === 'edit-hive-btn' && activeHiveId) {
      var btn = document.querySelector('.edit-hive-btn[data-hive-id="' + activeHiveId + '"]');
      if (btn) { btn.click(); showVoiceStatus("✅ Modification ouverte"); return; }
    }
    var btn = document.getElementById(foundId);
    if (btn) {
      btn.click();
      showVoiceStatus("✅ Clic : " + foundId);
      return;
    }
  }

  // ==========================================
  // 3. GESTION DES DONNÉES (Avec l'IA pour remplir)
  // ==========================================
  showVoiceStatus("🤖 Analyse des données...");
  
  // On récupère TOUS les champs présents sur l'écran
  var formFields = [];
  document.querySelectorAll('.field').forEach(function(field) {
    var labelEl = field.querySelector('label');
    var label = labelEl ? labelEl.textContent.trim() : null;
    var input = field.querySelector('input, select, textarea');
    if (label && input) formFields.push('Field: "' + label + '" (ID: ' + input.id + ')');
  });

  // Si on n'est pas sur un formulaire, on ne fait rien
  if (formFields.length === 0) {
    showVoiceStatus("⚠️ Aucun champ à remplir ici.");
    return;
  }

  // Le prompt est très direct : "Voici les champs, voici ce que j'ai dit, remplis-les"
  var systemPrompt = 'Available Fields:\n' + formFields.join('\n') + 
    '\n\nUser said: "' + transcript + '"' +
    '\n\nYou must return a JSON object like this: { "action": "fill_form", "data": { "field_id": "value" } }.' +
    '\nOnly include fields that the user actually mentioned. Do not invent data.';

  try {
    var llmResponse = await fetch('https://hdhoctahsnqlvqsmwrsf.supabase.co/functions/v1/groq-ai', { 
      method: 'POST', 
      headers: { 
        'Authorization': 'Bearer sb_publishable_Ydpj5A6_qxPfX2EcDM8Ogw_J1-t3Z8D',
        'Content-Type': 'application/json'
      }, 
      body: JSON.stringify({
        model: 'llama-3.1-8b-instant', // 8B est suffisant et plus obéissant
        messages: [
          { role: 'system', content: 'You are a JSON API. Output ONLY valid JSON.' },
          { role: 'user', content: systemPrompt }
        ],
        temperature: 0.0,
        response_format: { type: 'json_object' }
      })
    });

    if (!llmResponse.ok) throw new Error("LLM API failed");
    
    var llmResult = await llmResponse.json();
    var rawContent = llmResult.choices[0].message.content;
    
    // Nettoyage
    rawContent = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
    var firstBrace = rawContent.indexOf('{');
    var lastBrace = rawContent.lastIndexOf('}');
    if (firstBrace !== -1 && lastBrace !== -1) rawContent = rawContent.substring(firstBrace, lastBrace + 1);
    
    var parsed = JSON.parse(rawContent);
    console.log("AI parsed:", parsed);
    
    if (parsed.action === "fill_form" && parsed.data) {
      await executeAIAction(parsed);
    } else {
      showVoiceStatus("⚠️ Je n'ai pas compris les données.");
    }
    
  } catch (err) {
    console.error(err);
    showVoiceStatus("⚠️ Erreur de compréhension : " + err.message);
  }
}
