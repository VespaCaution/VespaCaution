      var email = document.getElementById('authEmail').value;
      var pass = document.getElementById('authPassword').value;
      var msg = document.getElementById('authMessage');
      msg.innerText = "Creating..."; msg.style.color = "#c47b2e";
      
      var result = await supabase.auth.signUp({ email: email, password: pass });
      if (result.error) {
        msg.innerText = "Error: " + result.error.message; msg.style.color = "red";
      } else {
        msg.innerText = "Account created! Now click Log In."; msg.style.color = "green";
      }
    };

    document.getElementById('forgotBtn').onclick = async function() {
      var email = document.getElementById('authEmail').value;
      var msg = document.getElementById('authMessage');
      if (!email) { msg.innerText = "Please enter your email first."; msg.style.color = "red"; return; }
      msg.innerText = "Sending reset email..."; msg.style.color = "#c47b2e";
      var result = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
      if (result.error) { msg.innerText = "Error: " + result.error.message; msg.style.color = "red"; }
      else { msg.innerText = "Email sent! Check your inbox."; msg.style.color = "green"; }
    };

    document.getElementById('saveNewPasswordBtn').onclick = async function() {
      var newPass = document.getElementById('newPassword').value;
      var msg = document.getElementById('resetMessage');
      if (!newPass) { msg.innerText = "Enter a password."; msg.style.color = "red"; return; }
      msg.innerText = "Saving..."; msg.style.color = "#c47b2e";
      var result = await supabase.auth.updateUser({ password: newPass });
      if (result.error) { msg.innerText = "Error: " + result.error.message; msg.style.color = "red"; }
      else { msg.innerText = "Password updated! Redirecting..."; msg.style.color = "green"; setTimeout(function() { document.getElementById('resetScreen').style.display = 'none'; showApp(); }, 1500); }
    };

    document.getElementById('passkeyLoginBtn').onclick = async function() {
      var msg = document.getElementById('authMessage');
      msg.innerText = "Biometric verification..."; msg.style.color = "#c47b2e";
      try {
        var result = await supabase.auth.signInWithPasskey();
        if (result.error) throw result.error;
        showApp();
      } catch (err) {
        msg.innerText = "Error: " + err.message; msg.style.color = "red";
      }
    };

    supabase.auth.onAuthStateChange(function(event, session) {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('resetScreen').style.display = 'block';
      } else if (session) {
        document.getElementById('passkeyLoginBtn').style.display = 'block';
        showApp();
      }
    });

    supabase.auth.getSession().then(function(result) {
      if (result.data.session) { 
        document.getElementById('passkeyLoginBtn').style.display = 'block';
        showApp(); 
      }
    });

    async function showApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('resetScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('voiceBtn').style.display = 'flex';
      try {
        var userResult = await supabase.auth.getUser();
        if (userResult.data.user) {
           var dbResult = await supabase.from('user_data').select('data').eq('user_id', userResult.data.user.id).single();
           if (dbResult.data && dbResult.data.data) appData = dbResult.data.data;
        }
      } catch (err) { console.error(err); }
      render();
    }

    async function saveData(data) {
      appData = data;
      var userResult = await supabase.auth.getUser();
      if (userResult.data.user) {
        await supabase.from('user_data').upsert({ user_id: userResult.data.user.id, data: data, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
      }
    }

    // --- ACCOUNT PAGE ---
    async function renderAccountPage() {
      var appEl = document.getElementById('app');
      var userResult = await supabase.auth.getUser();
      var userId = userResult.data.user ? userResult.data.user.id : 'Unknown';
      
      var html = '<button class="back-link" id="backToApiariesFromAccount">← ' + t('backToApiaries') + '</button>';
      html += '<div class="app-header"><h1>' + t('account') + '</h1></div>';
      html += '<div class="form-panel" style="text-align: center; margin-top: 2rem;">';
      html += '<p style="font-size: 0.85rem; color: #7a6a58; margin-bottom: 0.5rem;">' + t('userId') + '</p>';
      html += '<p style="font-family: monospace; background: #f0e4d4; padding: 0.5rem; border-radius: 10px; margin-bottom: 2rem; word-break: break-all;">' + userId + '</p>';
      
      html += '<button id="enableBiometricsBtn" class="outline" style="width: 100%; margin-bottom: 1rem;">🔐 ' + t('enableBiometrics') + '</button>';
      html += '<button id="logoutBtn" class="danger" style="width: 100%;">' + t('logout') + '</button>';
      html += '</div>';
      
      appEl.innerHTML = html;

      document.getElementById('backToApiariesFromAccount').onclick = function() {
        currentView = 'apiary-list';
        render();
      };

      document.getElementById('enableBiometricsBtn').onclick = async function() {
        try {
          var result = await supabase.auth.registerPasskey();
          if (result.error) throw result.error;
          nativeAlert(t('biometricEnabled'));
        } catch (err) {
          nativeAlert("Error: " + err.message);
        }
      };

      document.getElementById('logoutBtn').onclick = async function() {
        await supabase.auth.signOut();
        document.getElementById('app').style.display = 'none';
        document.getElementById('voiceBtn').style.display = 'none';
        document.getElementById('authScreen').style.display = 'block';
        document.getElementById('passkeyLoginBtn').style.display = 'none';
      };
    }

    // --- MODALS & HELPERS ---
    var modalEl = document.getElementById('modal'); var modalBackdrop = document.getElementById('modalBackdrop'); var modalTitleEl = document.getElementById('modalTitle'); var modalBodyEl = document.getElementById('modalBody'); var modalActionsEl = document.getElementById('modalActions'); var modalResolver = null;
    function openModal(options) { return new Promise(function(resolve) { modalTitleEl.textContent = options.title || ''; modalBodyEl.textContent = options.body || ''; modalActionsEl.innerHTML = ''; options.actions.forEach(function(action) { var btn = document.createElement('button'); btn.textContent = action.label; if (action.primary) btn.className = 'primary'; else if (action.danger) btn.className = 'danger'; else btn.className = 'outline'; btn.addEventListener('click', function() { var result = action.value; modalEl.classList.remove('visible'); modalBackdrop.classList.remove('visible'); modalActionsEl.innerHTML = ''; modalResolver = null; resolve(result); }); modalActionsEl.appendChild(btn); }); modalResolver = resolve; modalBackdrop.classList.add('visible'); modalEl.classList.add('visible'); }); }
    function nativeAlert(message, title) { return openModal({ title: title || t('alertTitle'), body: message, actions: [{ label: t('ok'), primary: true, value: true }] }); }
    function nativeDeleteConfirm(message) { return openModal({ title: t('deleteTitle'), body: message, actions: [{ label: t('no'), outline: true, value: false }, { label: t('delete'), danger: true, value: true }] }); }
    modalBackdrop.addEventListener('click', function() { if (modalResolver) { modalEl.classList.remove('visible'); modalBackdrop.classList.remove('visible'); modalActionsEl.innerHTML = ''; var r = modalResolver; modalResolver = null; r(false); } });

    function generateId() { return crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).substr(2, 9); }
    function findApiary(id) { return appData.apiaries.find(function(a) { return a.id === id; }); }
    function findHive(apiaryId, hiveId) { var apiary = findApiary(apiaryId); if (!apiary) return null; return apiary.hives.find(function(h) { return h.id === hiveId; }); }
    function isSwarmAlertActive(hive) { if (!hive.swarmRisk || !hive.swarmRiskSetAt) return false; return ((new Date() - new Date(hive.swarmRiskSetAt)) / (1000 * 60 * 60 * 24)) >= 14; }
    function apiaryHasSwarmAlert(apiary) { return apiary.hives.some(function(h) { return isSwarmAlertActive(h); }); }
    var queenColors = [ { value: 'blue', labelKey: 'queenColorBlue' }, { value: 'white', labelKey: 'queenColorWhite' }, { value: 'yellow', labelKey: 'queenColorYellow' }, { value: 'red', labelKey: 'queenColorRed' }, { value: 'green', labelKey: 'queenColorGreen' } ];
    function renderLangSelector() { return '<div class="lang-selector">' + ['en','fr','de','it','rm'].map(function(l) { return '<button class="lang-btn ' + (currentLang === l ? 'active' : '') + '" data-lang="' + l + '">' + l.toUpperCase() + '</button>'; }).join('') + '</div>'; }
    function attachLangListeners() { document.querySelectorAll('.lang-btn').forEach(function(btn) { btn.addEventListener('click', function() { currentLang = btn.dataset.lang; render(); }); }); }

    var appEl = document.getElementById('app');

    // --- RENDER FUNCTIONS ---
    function renderApiaryList() {
      var apiaries = appData.apiaries; var anySwarmAlert = apiaries.some(function(a) { return apiaryHasSwarmAlert(a); });
      var html = '<button class="account-btn" id="accountBtn">👤 ' + t('account') + '</button>';
      html += '<div class="app-header"><h1>🐝 ' + t('appName') + ' <small>v1.2 · ' + t('apiaryTracker') + '</small></h1>' + renderLangSelector() + '</div>';
      html += (anySwarmAlert ? '<div style="background:#f5d9b0;color:#8a5c00;padding:0.6rem 1rem;border-radius:1rem;margin-bottom:1rem;font-weight:500;display:flex;align-items:center;gap:0.5rem;">' + t('swarmAlertActive') + '</div>' : '');
      html += '<div class="subhead">' + t('manageApiaries') + '</div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;"><span style="font-weight:500;color:#7a6a58;">' + apiaries.length + ' ' + (apiaries.length !== 1 ? t('apiaries') : t('apiary')) + '</span><div style="display:flex;gap:0.5rem;flex-wrap:wrap;"><button class="outline" id="exportCsvBtn">' + t('exportCSV') + '</button><button class="primary" id="addApiaryBtn">' + t('addApiary') + '</button></div></div>';
      
      if (apiaries.length === 0) { html += '<div class="empty-state">' + t('noApiaries') + '</div>'; } 
      else {
        html += '<div class="apiary-grid">';
        apiaries.forEach(function(apiary) {
          var hiveCount = apiary.hives.length; var hasAlert = apiaryHasSwarmAlert(apiary);
          html += '<div class="apiary-card ' + (hasAlert ? 'has-swarm-risk' : '') + '" data-apiary-id="' + apiary.id + '"><div class="apiary-info"><span class="apiary-name">' + escapeHtml(apiary.name) + (hasAlert ? ' <span class="swarm-alert-badge">' + t('swarmAlert') + '</span>' : '') + '</span><div class="apiary-meta"><span>🧭 ' + escapeHtml(apiary.orientation || '—') + '</span><span>📍 ' + escapeHtml(apiary.coordinates || '—') + '</span><span>🐝 ' + hiveCount + ' ' + (hiveCount !== 1 ? t('hives') : t('hive')) + '</span></div></div><div style="display:flex;gap:0.5rem;"><button class="small outline edit-apiary-btn" data-apiary-id="' + apiary.id + '">' + t('edit') + '</button><button class="small danger delete-apiary-btn" data-apiary-id="' + apiary.id + '">' + t('delete') + '</button></div></div>';
        });
        html += '</div>';
      }
      appEl.innerHTML = html; attachLangListeners();

      document.getElementById('accountBtn').onclick = function() { currentView = 'account'; render(); };
      document.getElementById('addApiaryBtn').onclick = function() { currentView = 'add-apiary'; editApiaryData = { name: '', orientation: '', coordinates: '' }; render(); };
      document.getElementById('exportCsvBtn').onclick = exportAllVisitsCSV;
      document.querySelectorAll('.apiary-card').forEach(function(card) { card.onclick = function(e) { if (e.target.closest('button')) return; activeApiaryId = card.dataset.apiaryId; currentView = 'hive-list'; render(); }; });
      document.querySelectorAll('.edit-apiary-btn').forEach(function(btn) { btn.onclick = function(e) { e.stopPropagation(); var apiary = findApiary(btn.dataset.apiaryId); if (!apiary) return; editApiaryData = { name: apiary.name, orientation: apiary.orientation, coordinates: apiary.coordinates, id: apiary.id }; activeApiaryId = apiary.id; currentView = 'edit-apiary'; render(); }; });
      document.querySelectorAll('.delete-apiary-btn').forEach(function(btn) { btn.onclick = async function(e) { e.stopPropagation(); if (await nativeDeleteConfirm(t('deleteApiaryConfirm'))) { appData.apiaries = appData.apiaries.filter(function(a) { return a.id !== btn.dataset.apiaryId; }); saveData(appData); render(); } }; });
    }

    // (The rest of the render functions remain exactly the same as your working version: renderHiveList, renderHiveVisits, renderApiaryForm, renderHiveForm, export functions, AI Voice, and render())

    function render() {
      if (currentView === 'apiary-list') renderApiaryList();
      else if (currentView === 'hive-list') renderHiveList();
      else if (currentView === 'add-apiary' || currentView === 'edit-apiary') renderApiaryForm();
      else if (currentView === 'add-hive' || currentView === 'edit-hive') renderHiveForm();
      else if (currentView === 'hive-visits') renderHiveVisits();
      else if (currentView === 'account') renderAccountPage();
      else renderApiaryList();
    }
  </script>
</body>
</html>
