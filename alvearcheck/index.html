<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Test</title>
  <style>
    body { font-family: sans-serif; background: #fbf6e8; padding: 2rem; }
    #authScreen { background: white; padding: 2rem; border-radius: 10px; text-align: center; border: 2px solid red; }
    #app { display: none; background: #e8f5e9; padding: 2rem; border-radius: 10px; text-align: center; border: 2px solid green; }
    button { padding: 15px; font-size: 18px; background: #c47b2e; color: white; border: none; border-radius: 5px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="authScreen">
    <h2 style="color: red;">THIS IS THE LOGIN SCREEN</h2>
    <p>Click the button below. It should hide this red box and show a green box.</p>
    <button id="loginBtn">CLICK ME TO SWITCH SCREENS</button>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <h2 style="color: green;">SUCCESS! THIS IS THE APP SCREEN.</h2>
    <p>If you can see this, the screen switching works perfectly.</p>
  </div>

  <script>
    // We are ONLY testing if the button can hide one div and show another.
    document.getElementById('loginBtn').addEventListener('click', function() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    });
  </script>
</body>
</html>
