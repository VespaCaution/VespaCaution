<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlvearCheck Debug</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fbf6e8; }
    #debugBox { display: none; background: #ffcccc; color: red; padding: 15px; border: 2px solid red; margin-bottom: 20px; font-weight: bold; white-space: pre-wrap; }
    #authScreen { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
    input, button { display: block; width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
    button { background: #c47b2e; color: white; border: none; cursor: pointer; font-weight: bold; }
    #app { display: none; background: #e8f5e9; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid green; }
  </style>
</head>
<body>

  <!-- IF THERE IS A CRASH, IT WILL SHOW HERE -->
  <div id="debugBox"></div>

  <div id="authScreen">
    <h2>Login Test</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Log In</button>
    <button id="registerBtn" style="background: gray;">Register</button>
    <p id="msg"></p>
  </div>

  <div id="app">
    <h2 style="color: green;">🎉 SUCCESS! YOU ARE LOGGED IN.</h2>
    <p>The app would show here.</p>
  </div>

  <script>
    // Catch any crashes and show them on screen
    window.onerror = function(msg, url, line) {
      var box = document.getElementById('debugBox');
      box.style.display = 'block';
      box.innerHTML += "CRASH: " + msg + "<br>Line: " + line + "<br><br>";
    };

    try {
      var supabase = window.supabase.createClient('https://hdhoctahsnqlvqsmwrsf.supabase.co', 'sb_publishable_Ydpj5A6_qxPfX2EcDM8Ogw_J1-t3Z8D');

      document.getElementById('loginBtn').onclick = async function() {
        var email = document.getElementById('email').value;
        var pass = document.getElementById('password').value;
        var msg = document.getElementById('msg');
        msg.innerText = "Connecting...";
        
        var result = await supabase.auth.signInWithPassword({ email: email, password: pass });
        
        if (result.error) {
          msg.innerText = "Error: " + result.error.message;
          msg.style.color = "red";
        } else {
          document.getElementById('authScreen').style.display = 'none';
          document.getElementById('app').style.display = 'block';
        }
      };

      document.getElementById('registerBtn').onclick = async function() {
        var email = document.getElementById('email').value;
        var pass = document.getElementById('password').value;
        var msg = document.getElementById('msg');
        msg.innerText = "Creating...";
        
        var result = await supabase.auth.signUp({ email: email, password: pass });
        
        if (result.error) {
          msg.innerText = "Error: " + result.error.message;
          msg.style.color = "red";
        } else {
          msg.innerText = "Account created! Now click Log In.";
          msg.style.color = "green";
        }
      };

    } catch (e) {
      var box = document.getElementById('debugBox');
      box.style.display = 'block';
      box.innerHTML = "SETUP ERROR: " + e.message;
    }
  </script>
</body>
</html>
