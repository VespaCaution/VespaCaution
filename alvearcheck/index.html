        btn.classList.add('active'); showVoiceStatus("🎙️ Listening... Speak now.");
        try { streamRef = await navigator.mediaDevices.getUserMedia({ audio: true }); audioContext = new (window.AudioContext || window.webkitAudioContext)(); const source = audioContext.createMediaStreamSource(streamRef); analyser = audioContext.createAnalyser(); analyser.fftSize = 512; source.connect(analyser); startRecordingChunk(); } 
        catch (err) { nativeAlert("Microphone access denied."); btn.classList.remove('active'); }
      }

      function startRecordingChunk() {
        if (!streamRef) return;
        mediaRecorder = new MediaRecorder(streamRef); audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => { const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); if (audioBlob.size > 5000) await processDictation(audioBlob); if (isRecording) startRecordingChunk(); };
        mediaRecorder.start(); isRecording = true; monitorSilence();
      }

      function monitorSilence() {
        if (!analyser || !isRecording) return;
        const dataArray = new Uint8Array(analyser.frequencyBinCount); let silenceStart = Date.now(); let hasSpoken = false;
        function checkVolume() { if (!isRecording || !mediaRecorder || mediaRecorder.state !== 'recording') return; analyser.getByteFrequencyData(dataArray); let sum = 0; for (let i = 0; i < dataArray.length; i++) sum += dataArray[i]; if ((sum / dataArray.length) > 25) { hasSpoken = true; silenceStart = Date.now(); } if (hasSpoken && (Date.now() - silenceStart) > 1200) { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); return; } requestAnimationFrame(checkVolume); }
        checkVolume();
      }

      function stopDictation() { isRecording = false; if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); if (streamRef) streamRef.getTracks().forEach(t => t.stop()); if (audioContext) audioContext.close(); }

      async function processDictation(audioBlob) {
        showVoiceStatus("🧠 Transcribing...");
        try { const formData = new FormData(); formData.append('file', audioBlob, 'audio.webm'); formData.append('model', 'whisper-large-v3'); const langCode = currentLang === 'fr' ? 'fr' : currentLang === 'de' ? 'de' : currentLang === 'it' ? 'it' : 'en'; formData.append('language', langCode); const sttResponse = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method: 'POST', headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` }, body: formData }); const sttResult = await sttResponse.json(); const transcript = sttResult.text; if (!transcript || transcript.trim().length < 3) { showVoiceStatus("🎙️ Listening... (didn't catch that)"); return; } console.log("AI Heard:", transcript); showVoiceStatus(`📝 "${transcript}"`, 4000); await new Promise(r => setTimeout(r, 600)); await screenReaderAI(transcript); } 
        catch (err) { console.error(err); showVoiceStatus("⚠️ AI Error: " + err.message); }
      }

      async function screenReaderAI(transcript) {
        showVoiceStatus("🤖 Reading screen & filling...");
        const formFields = []; document.querySelectorAll('.field').forEach(field => { const label = field.querySelector('label')?.textContent.trim(); const input = field.querySelector('input, select, textarea'); if (label && input) formFields.push(`Label: "${label}" (ID: ${input.id})`); });
        let navContext = ""; if (currentView === 'apiary-list') navContext = "User is on the list of apiaries. Available apiaries: " + appData.apiaries.map(a => a.name).join(', '); else if (currentView === 'hive-list') { const apiary = findApiary(activeApiaryId); navContext = `User is viewing the hives of ${apiary.name}. Available hives: ` + apiary.hives.map(h => h.name).join(', '); }
        const systemPrompt = `You are an AI controlling a beekeeping app. ${navContext} Form fields visible: ${formFields.join('\n') || 'No form fields visible.'} The user said: "${transcript}". Actions you can take: 1. Navigate to a specific hive: { "action": "navigate", "target": "hive", "apiary_name": "Name", "hive_name": "Name" } 2. Add a new apiary: { "action": "navigate", "target": "add_apiary" } 3. Add a new hive: { "action": "navigate", "target": "add_hive" } 4. Go back: { "action": "navigate", "target": "go_back" } 5. Save: { "action": "navigate", "target": "save" } 6. Fill form fields (use IDs from above): { "action": "fill_form", "data": { "id": "value" } } Return ONLY valid raw JSON. No markdown.`;
        try { const llmResponse = await fetch('https://api.groq.com/openai/v1/chat/completions', { method: 'POST', headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'qwen/qwen3.8-27b', reasoning_effort: "none", messages: [{ role: 'user', content: systemPrompt }], temperature: 0.1, response_format: { type: 'json_object' } }) }); if (!llmResponse.ok) throw new Error("LLM API failed"); const llmResult = await llmResponse.json(); let rawContent = llmResult.choices[0].message.content; rawContent = rawContent.replace(/```json/g, '').replace(/```/g, '').trim(); const firstBrace = rawContent.indexOf('{'); const lastBrace = rawContent.lastIndexOf('}'); if (firstBrace !== -1 && lastBrace !== -1) rawContent = rawContent.substring(firstBrace, lastBrace + 1); const parsed = JSON.parse(rawContent); console.log("AI Action:", parsed); await executeAIAction(parsed); } 
        catch (err) { console.error("LLM Error:", err); showVoiceStatus("⚠️ AI failed to read screen."); }
      }

      async function executeAIAction(data) {
        if (data.action === "navigate" && data.target === "hive") {
            if (data.apiary_name) { const apiary = appData.apiaries.find(a => a.name.toLowerCase().includes(data.apiary_name.toLowerCase())); if (apiary) { activeApiaryId = apiary.id; currentView = 'hive-list'; render(); await new Promise(r => setTimeout(r, 400)); } else { showVoiceStatus("⚠️ Apiary not found"); return; } }
            if (data.hive_name && activeApiaryId) { const apiary = findApiary(activeApiaryId); const hive = apiary.hives.find(h => h.name.toLowerCase().includes(data.hive_name.toLowerCase())); if (hive) { activeHiveId = hive.id; editHiveData = { name: hive.name, maleFrames: hive.maleFrames ?? '', honeyFrames: hive.honeyFrames ?? '', broodFrames: hive.broodFrames ?? '', swarmRisk: hive.swarmRisk, queenColor: hive.queenColor, varroaCount: hive.varroaCount ?? '', remarks: hive.remarks ?? '' }; currentView = 'edit-hive'; render(); showVoiceStatus("✅ Opened " + hive.name); } else { showVoiceStatus("⚠️ Hive not found"); return; } }
            return;
        }
        if (data.action === "navigate") {
            if (data.target === "add_apiary") { currentView = 'add-apiary'; editApiaryData = { name: '', orientation: '', coordinates: '' }; render(); return; }
            if (data.target === "add_hive") { if (!activeApiaryId) { showVoiceStatus("⚠️ Open an apiary first"); return; } currentView = 'add-hive'; editHiveData = { name: '', maleFrames: '', honeyFrames: '', broodFrames: '', swarmRisk: false, queenColor: 'blue', varroaCount: '', remarks: '' }; render(); return; }
            if (data.target === "go_back") { if (currentView === 'hive-visits') { currentView = 'hive-list'; activeHiveId = null; } else { currentView = 'apiary-list'; activeApiaryId = null; } render(); return; }
            if (data.target === "save") { const btn = document.getElementById('saveHiveBtn') || document.getElementById('saveApiaryBtn'); if (btn) { btn.click(); showVoiceStatus("✅ Saved"); } else { showVoiceStatus("⚠️ No form to save"); } return; }
        }
        if (data.action === "fill_form" && data.data) {
            showVoiceStatus(`✅ Filled: ${Object.keys(data.data).length} fields`, 4000);
            setTimeout(() => { for (const [id, val] of Object.entries(data.data)) { const el = document.getElementById(id); if (el && val != null && val !== '') { if (el.type === 'checkbox') el.checked = Boolean(val); else if (el.tagName === 'SELECT') { for (let opt of el.options) { if (opt.value.toLowerCase() === String(val).toLowerCase() || opt.text.toLowerCase() === String(val).toLowerCase()) { el.value = opt.value; break; } } } else { el.value = val; } el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); } } }, 100);
        }
      }

      const voiceBtnEl = document.getElementById('voiceBtn');
      if (voiceBtnEl) { voiceBtnEl.addEventListener('click', startHandsFreeDictation); voiceBtnEl.title = "AI Dictaphone"; }

      function render() {
        if (currentView === 'apiary-list') renderApiaryList();
        else if (currentView === 'hive-list') renderHiveList();
        else if (currentView === 'add-apiary' || currentView === 'edit-apiary') renderApiaryForm();
        else if (currentView === 'add-hive' || currentView === 'edit-hive') renderHiveForm();
        else if (currentView === 'hive-visits') renderHiveVisits();
        else renderApiaryList();
      }
    });
  </script>
</body>
</html>
