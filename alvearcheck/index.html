  .field label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #7f6b56; }

  .visit-history-header { background: #f0e4d4; padding: 0.8rem 1.2rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }

  .visit-table th { background: #f9f3e9; padding: 0.6rem; text-align: left; font-weight: 600; border-bottom: 1px solid #e8d9c4; }
  .visit-table td { padding: 0.6rem; border-bottom: 1px solid #f0e8dc; }
  .voice-status { position: fixed; bottom: 6rem; right: 2rem; background: #2e241b; color: #fbf6e8; padding: 0.6rem 1.2rem; border-radius: 40px; font-size: 0.85rem; z-index: 99; max-width: 280px; display: none; }
  .voice-status.visible { display: block; }
  #authScreen { max-width: 400px; margin: 10vh auto; padding: 2rem; background: #fffdf7; border-radius: 2rem; text-align: center; border: 1px solid #f0e3cf; }
  #authScreen h2 { color: #c47b2e; margin-bottom: 1rem; }
  #authScreen input { margin-bottom: 1rem; }

<body>

  <!-- IF THERE IS A CRASH, IT WILL SHOW HERE -->

  <div id="authScreen">
    <h2>Login Test</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Log In</button>

    <h2 style="color: green;">🎉 SUCCESS! YOU ARE LOGGED IN.</h2>

  </div>

  <script>
    // Catch any crashes and show them on screen
    window.onerror = function(msg, url, line) {
      var box = document.getElementById('debugBox');
      box.style.display = 'block';
      box.innerHTML += "CRASH: " + msg + "<br>Line: " + line + "<br><br>";
    };

    try {
      var supabase = window.supabase.createClient('https://hdhoctahsnqlvqsmwrsf.supabase.co', 'sb_publishable_Ydpj5A6_qxPfX2EcDM8Ogw_J1-t3Z8D');

      document.getElementById('loginBtn').onclick = async function() {
        var email = document.getElementById('email').value;
        var pass = document.getElementById('password').value;
        var msg = document.getElementById('msg');
        msg.innerText = "Connecting...";
        
        var result = await supabase.auth.signInWithPassword({ email: email, password: pass });
        
        if (result.error) {
          msg.innerText = "Error: " + result.error.message;
          msg.style.color = "red";
        } else {
          document.getElementById('authScreen').style.display = 'none';
          document.getElementById('app').style.display = 'block';
        }
      };

      document.getElementById('registerBtn').onclick = async function() {
        var email = document.getElementById('email').value;
        var pass = document.getElementById('password').value;
        var msg = document.getElementById('msg');
        msg.innerText = "Creating...";
        
        var result = await supabase.auth.signUp({ email: email, password: pass });
        
        if (result.error) {
          msg.innerText = "Error: " + result.error.message;
          msg.style.color = "red";
        } else {
          msg.innerText = "Account created! Now click Log In.";
          msg.style.color = "green";
        }
      };

    } catch (e) {
      var box = document.getElementById('debugBox');
      box.style.display = 'block';
      box.innerHTML = "SETUP ERROR: " + e.message;
    }
    // --- TRADUCTIONS (Partiel pour l'exemple, ajoute les autres si besoin) ---
let currentLang = 'fr';
const translations = {
  fr: { appName: 'AlvearCheck', apiaryTracker: 'suivi des ruchers', manageApiaries: 'Gérez vos ruchers et leurs ruches', addApiary: '＋ Ajouter un rucher', apiary: 'rucher', apiaries: 'ruchers', addHive: '＋ Ajouter une ruche', hive: 'ruche', hives: 'ruches', backToApiaries: '← Retour aux ruchers', backToHives: '← Retour aux ruches', edit: '✎ Modifier', delete: '✕ Supprimer', deleteApiaryConfirm: 'Supprimer ce rucher ?', deleteHiveConfirm: 'Supprimer cette ruche ?', noApiaries: 'Aucun rucher.', noHives: 'Aucune ruche.', noVisits: 'Aucune visite.', visits: 'Visites', allVisits: 'Toutes les visites', date: 'Date', maleFrames: 'Cadres mâles', honeyFrames: 'Cadres de miel', broodFrames: 'Cadres de couvain', swarmRisk: 'Essaimage', queenColor: 'Reine', varroa: 'Varroa', remarks: 'Remarques', swarmAlert: '⚠️ alerte', atRisk: '⚠️ risque', swarmAlertActive: '⚠️ Alerte essaimage', apiaryName: 'Nom du rucher *', orientation: 'Orientation', coordinates: 'Coordonnées', hiveName: 'Nom de la ruche *', queenColorYear: 'Couleur reine', varroaCount: 'Varroas', atRiskOfSwarming: 'Risque d\'essaimage', notes: 'Notes...', save: 'Enregistrer', create: 'Créer', cancel: 'Annuler', pleaseEnterApiaryName: 'Entrez un nom.', pleaseEnterHiveName: 'Entrez un nom.', useMyLocation: 'Ma position', exportCSV: '📥 CSV', noDataToExport: 'Rien à exporter.', editApiary: 'Modifier rucher', newApiary: 'Nouveau rucher', editHive: 'Modifier ruche', newHive: 'Nouvelle ruche', queenColorBlue: 'Bleu', queenColorWhite: 'Blanc', queenColorYellow: 'Jaune', queenColorRed: 'Rouge', queenColorGreen: 'Vert', ok: 'OK', yes: 'Oui', no: 'Non' }
};
function t(key) { return translations[currentLang][key] || key; }
function escapeHtml(str) { if (str == null) return ''; return String(str).replace(/[&<>"]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return m; }); }

let appData = { apiaries: [] };
let currentView = 'apiary-list';
let activeApiaryId = null;
let activeHiveId = null;
let editApiaryData = null;
let editHiveData = null;
let geoLoading = false;

async function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('voiceBtn').style.display = 'flex';
  try {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
       const { data } = await supabase.from('user_data').select('data').eq('user_id', user.id).single();
       if (data && data.data) appData = data.data;
    }
  } catch (err) { console.error(err); }
  render();
}

async function saveData(data) {
  appData = data;
  const { data: { user } } = await supabase.auth.getUser();
  if (user) {
    await supabase.from('user_data').upsert({ user_id: user.id, data: data, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
  }
}

// MODALS
const modalEl = document.getElementById('modal'); const modalBackdrop = document.getElementById('modalBackdrop'); const modalTitleEl = document.getElementById('modalTitle'); const modalBodyEl = document.getElementById('modalBody'); const modalActionsEl = document.getElementById('modalActions'); let modalResolver = null;
function openModal(options) { return new Promise(function(resolve) { modalTitleEl.textContent = options.title || ''; modalBodyEl.textContent = options.body || ''; modalActionsEl.innerHTML = ''; options.actions.forEach(function(action) { const btn = document.createElement('button'); btn.textContent = action.label; if (action.primary) btn.className = 'primary'; else if (action.danger) btn.className = 'danger'; else btn.className = 'outline'; btn.addEventListener('click', function() { const result = action.value; modalEl.classList.remove('visible'); modalBackdrop.classList.remove('visible'); modalActionsEl.innerHTML = ''; modalResolver = null; resolve(result); }); modalActionsEl.appendChild(btn); }); modalResolver = resolve; modalBackdrop.classList.add('visible'); modalEl.classList.add('visible'); }); }
function nativeAlert(message, title) { return openModal({ title: title || t('alertTitle'), body: message, actions: [{ label: t('ok'), primary: true, value: true }] }); }
function nativeDeleteConfirm(message) { return openModal({ title: t('deleteTitle'), body: message, actions: [{ label: t('no'), outline: true, value: false }, { label: t('delete'), danger: true, value: true }] }); }
modalBackdrop.addEventListener('click', function() { if (modalResolver) { modalEl.classList.remove('visible'); modalBackdrop.classList.remove('visible'); modalActionsEl.innerHTML = ''; const r = modalResolver; modalResolver = null; r(false); } });

// HELPERS
function generateId() { return crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).substr(2, 9); }
function findApiary(id) { return appData.apiaries.find(a => a.id === id); }
function findHive(apiaryId, hiveId) { const apiary = findApiary(apiaryId); if (!apiary) return null; return apiary.hives.find(h => h.id === hiveId); }
function isSwarmAlertActive(hive) { if (!hive.swarmRisk || !hive.swarmRiskSetAt) return false; return ((new Date() - new Date(hive.swarmRiskSetAt)) / (1000 * 60 * 60 * 24)) >= 14; }
function apiaryHasSwarmAlert(apiary) { return apiary.hives.some(h => isSwarmAlertActive(h)); }
const queenColors = [ { value: 'blue', labelKey: 'queenColorBlue' }, { value: 'white', labelKey: 'queenColorWhite' }, { value: 'yellow', labelKey: 'queenColorYellow' }, { value: 'red', labelKey: 'queenColorRed' }, { value: 'green', labelKey: 'queenColorGreen' } ];
function renderLangSelector() { return '<div class="lang-selector">' + ['fr','en'].map(l => `<button class="lang-btn ${currentLang === l ? 'active' : ''}" data-lang="${l}">${l.toUpperCase()}</button>`).join('') + '</div>'; }
function attachLangListeners() { document.querySelectorAll('.lang-btn').forEach(btn => { btn.addEventListener('click', () => { currentLang = btn.dataset.lang; render(); }); }); }

const appEl = document.getElementById('app');

// RENDER FUNCTIONS (Ajoute-les toutes ici)
function renderApiaryList() {
  const apiaries = appData.apiaries; const anySwarmAlert = apiaries.some(a => apiaryHasSwarmAlert(a));
  let html = `<div class="app-header"><h1>🐝 ${t('appName')} <small>v1.0</small></h1>${renderLangSelector()}</div><div class="subhead">${t('manageApiaries')}</div><div style="display:flex;justify-content:space-between;margin-bottom:1rem;"><span>${apiaries.length} ${t('apiaries')}</span><div><button class="outline" id="exportCsvBtn">${t('exportCSV')}</button><button class="primary" id="addApiaryBtn">${t('addApiary')}</button></div></div>`;
  if (apiaries.length === 0) html += `<div class="empty-state">${t('noApiaries')}</div>`;
  else { html += `<div class="apiary-grid">`; apiaries.forEach(apiary => { const hiveCount = apiary.hives.length; const hasAlert = apiaryHasSwarmAlert(apiary); html += `<div class="apiary-card ${hasAlert ? 'has-swarm-risk' : ''}" data-apiary-id="${apiary.id}"><div class="apiary-info"><span class="apiary-name">${escapeHtml(apiary.name)}</span><div class="apiary-meta"><span>🧭 ${escapeHtml(apiary.orientation || '—')}</span><span>📍 ${escapeHtml(apiary.coordinates || '—')}</span><span>🐝 ${hiveCount} ${t('hives')}</span></div></div><div><button class="small outline edit-apiary-btn" data-apiary-id="${apiary.id}">${t('edit')}</button><button class="small danger delete-apiary-btn" data-apiary-id="${apiary.id}">${t('delete')}</button></div></div>`; }); html += `</div>`; }
  appEl.innerHTML = html; attachLangListeners();
  document.getElementById('addApiaryBtn').onclick = () => { currentView = 'add-apiary'; editApiaryData = { name: '', orientation: '', coordinates: '' }; render(); };
  document.querySelectorAll('.apiary-card').forEach(card => { card.onclick = (e) => { if (e.target.closest('button')) return; activeApiaryId = card.dataset.apiaryId; currentView = 'hive-list'; render(); }; });
  document.querySelectorAll('.edit-apiary-btn').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); const apiary = findApiary(btn.dataset.apiaryId); editApiaryData = { ...apiary }; activeApiaryId = apiary.id; currentView = 'edit-apiary'; render(); }; });
  document.querySelectorAll('.delete-apiary-btn').forEach(btn => { btn.onclick = async (e) => { e.stopPropagation(); if (await nativeDeleteConfirm(t('deleteApiaryConfirm'))) { appData.apiaries = appData.apiaries.filter(a => a.id !== btn.dataset.apiaryId); saveData(appData); render(); } }; });
  document.getElementById('exportCsvBtn').onclick = exportAllVisitsCSV;
}

function render() { if (currentView === 'apiary-list') renderApiaryList(); /* ajoute les autres */ }
  </script>
