    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-color: #f9f7f1;
            --surface: #ffffff;
            --primary: #c99b48;
            --primary-hover: #b5883b;
            --primary-light: #fdfaf3;
            --text-main: #2d2d2d;
            --text-muted: #6b6b6b;
            --border: #e6e2d8;
            --danger: #d9534f;
            --danger-bg: #fdf3f2;
            --success: #5cb85c;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 30px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; color: var(--text-main); line-height: 1.3; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; height: auto; display: block; }

        /* --- HEADER & NAVIGATION --- */
        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            min-height: 70px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        
        .logo-container img {
            height: 40px;
            width: auto;
            max-width: 200px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .logo-container:hover img { transform: scale(1.03); }

        .lang-selector {
            display: flex;
            gap: 2px;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }
        .lang-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .lang-btn:hover { color: var(--primary); }
        .lang-btn.active { background: var(--white); color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* --- DROPDOWN MENU --- */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { 
    background: none; border: none; font-family: inherit; font-size: 0.9rem; font-weight: 600; 
    color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 5px; 
    padding: 5px 0; height: 28px; /* <-- Ajout de la hauteur fixe */
        }
        .dropdown-btn:hover { color: var(--primary); }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--surface);
            min-width: 220px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 12px;
            z-index: 1001;
            top: 100%;
            left: 0;
            padding: 10px 0;
            margin-top: 10px;
            animation: fadeIn 0.2s ease;
        }
        .dropdown-content.show { display: block; }
        .dropdown-content a, .dropdown-content button {
            color: var(--text-main); padding: 10px 20px; text-decoration: none; display: flex; align-items: center; gap: 10px;
            width: 100%; text-align: left; border: none; background: none; font-size: 0.9rem; cursor: pointer;
            transition: background 0.2s; font-family: inherit;
        }
        .dropdown-content a:hover, .dropdown-content button:hover { background: var(--primary-light); color: var(--primary); }
        .dropdown-divider { height: 1px; background: var(--border); margin: 8px 0; }

        nav { display: flex; gap: 20px; align-items: center; font-size: 0.9rem; font-weight: 600; }
        nav a { position: relative; padding: 5px 0; color: var(--text-muted); transition: color 0.2s; }
        nav a:hover { color: var(--primary); }
        
        .social-icons { display: flex; gap: 10px; margin-left: 10px; align-items: center; }
        .social-icons img { height: 20px; width: 20px; transition: transform 0.2s; filter: grayscale(100%) opacity(0.7); }
        .social-icons img:hover { transform: translateY(-2px); filter: grayscale(0%) opacity(1); }

        /* --- MAIN LAYOUT --- */
        main { max-width: 1000px; margin: 30px auto; padding: 0 20px; min-height: 70vh; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- HOME PAGE --- */
        .hero { text-align: center; margin-bottom: 40px; padding: 20px; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 15px; color: var(--primary); }
        .hero p { font-size: 1.1rem; color: var(--text-muted); max-width: 700px; margin: 0 auto 15px auto; }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 20px; }
        .app-card {
            background: var(--surface);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .app-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: var(--primary-light); }
        .app-card h3 { font-size: 1.4rem; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; color: var(--primary); }
        .app-card p { flex-grow: 1; margin-bottom: 20px; color: var(--text-muted); font-size: 0.95rem; }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--primary); color: #fff;
            padding: 12px 24px; border-radius: 30px;
            font-weight: 600; font-size: 0.95rem;
            border: none; cursor: pointer;
            transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(201, 155, 72, 0.2);
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(201, 155, 72, 0.3); }
        .btn:active { transform: translateY(0); }

        /* --- APP DETAILS PAGE --- */
        .app-header { text-align: center; margin-bottom: 30px; }
        .app-header h1 { font-size: 2.2rem; color: var(--primary); }
        .app-header p { font-size: 1.1rem; color: var(--text-muted); }
        
        .app-content-box {
            background: var(--surface); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .app-content-box h3 { margin-top: 25px; margin-bottom: 15px; color: var(--primary); font-size: 1.3rem; }
        .app-content-box p { margin-bottom: 15px; color: var(--text-main); font-size: 0.95rem; }
        .app-content-box ul { margin-left: 20px; margin-bottom: 20px; color: var(--text-main); font-size: 0.95rem; }
        .app-content-box li { margin-bottom: 8px; }
        .app-content-box strong { color: var(--text-main); }
        
        .main-open-btn { font-size: 1.05rem; padding: 14px 30px; margin: 20px 0 30px 0; width: 100%; max-width: 350px; display: flex; margin-left: auto; margin-right: auto; }

        /* --- ACCORDION (Instructions) --- */
        .accordion { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg-color); margin-top: 30px; }
        .accordion-header {
            background: var(--surface); color: var(--text-main); padding: 18px 20px; cursor: pointer; font-weight: 700; font-family: 'Outfit', sans-serif; font-size: 1.1rem;
            display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
        }
        .accordion-header:hover { background: var(--primary-light); }
        .accordion-icon { font-size: 1.5rem; color: var(--primary); transition: transform 0.3s ease; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1); padding: 0 20px; background: var(--surface); }
        .accordion-content.active { max-height: 5000px; padding: 20px; border-top: 1px solid var(--border); }
        .accordion-content.active .accordion-icon { transform: rotate(45deg); }
        
        .instruction-step { margin-bottom: 30px; }
        .instruction-step h4 { color: var(--primary); font-size: 1.15rem; margin-bottom: 8px; }
        .instruction-step p { margin-bottom: 10px; }
        .instruction-step img { border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 10px auto; max-width: 100%; }

        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; margin: 30px 0; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .account-notice {
            display: flex; align-items: flex-start; gap: 15px;
            padding: 20px; border-radius: 12px; margin: 25px 0; font-weight: 600; line-height: 1.5; font-size: 0.95rem;
        }
        .account-notice.optional { background: #eef7ee; color: #2e7d32; border: 1px solid #c8e6c9; }
        .account-notice.mandatory { background: var(--danger-bg); color: var(--danger); border: 1px solid #f5c6cb; }
        .account-notice span { flex-shrink: 0; font-size: 1.2rem; }

        .contact-action { text-align: center; margin-top: 20px; }

        /* --- FORMS & OTHER PAGES --- */
        .page-title { font-size: 2.2rem; color: var(--primary); margin-bottom: 20px; text-align: center; }
        .resource-link {
            display: block; padding: 20px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; transition: all 0.2s;
        }
        .resource-link:hover { border-color: var(--primary); transform: translateX(5px); background: var(--primary-light); }
        .resource-link strong { display: block; color: var(--primary); font-size: 1.1rem; margin-bottom: 5px; }
        .resource-link span { font-size: 0.95rem; color: var(--text-muted); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; background: var(--bg-color); color: var(--text-main); transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
        
        /* --- FOOTER --- */
        footer { background: var(--surface); border-top: 1px solid var(--border); padding: 40px 20px 20px 20px; margin-top: 60px; }
        .footer-content { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; }
        .footer-content h3 { color: var(--primary); margin-bottom: 15px; font-size: 1.2rem; }
        .footer-content ul { list-style: none; }
        .footer-content li { margin-bottom: 10px; }
        .footer-content a { color: var(--text-muted); transition: color 0.2s; font-size: 0.95rem; }
        .footer-content a:hover { color: var(--primary); }
        .footer-bottom { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted); }

        .alert { padding: 15px; border-radius: 8px; text-align: center; font-weight: 600; margin-top: 15px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }

        @media (max-width: 768px) {
            header { flex-direction: column; padding: 12px; gap: 12px; }
            .header-left { width: 100%; justify-content: space-between; }
            .logo-container img { height: 35px; }
            nav { width: 100%; justify-content: center; flex-wrap: wrap; gap: 12px; font-size: 0.85rem; }
            .social-icons { margin-left: 0; }
            main { padding: 0 12px; margin: 20px auto; }
            .hero h1 { font-size: 1.8rem; }
            .app-grid { grid-template-columns: 1fr; gap: 15px; }
            .app-content-box { padding: 20px 15px; }
            .footer-content { grid-template-columns: 1fr; text-align: center; gap: 20px; }
            .dropdown-content { position: static; box-shadow: none; border: none; background: transparent; padding-left: 20px; margin-top: 5px; }
        }
    </style>
</head>

let currentLang = localStorage.getItem('vespacaution_lang') || 'fr';

function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('vespacaution_lang', lang);
    
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.querySelector(`.lang-btn[onclick="setLanguage('${lang}')"]`);
    if(activeBtn) activeBtn.classList.add('active');
    
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
            el.innerHTML = translations[lang][key];
        }
    });
    render();
}

function t(key) {
    return (translations[currentLang] && translations[currentLang][key]) ? translations[currentLang][key] : key;
}

        // ==========================================
        // 4. ROUTING LOGIC & ACCORDION
        // ==========================================
        
        const mainContent = document.getElementById('app-content');

        function toggleAccordion(header) {
            const content = header.nextElementSibling;
            if (content.classList.contains('active')) {
                content.classList.remove('active');
            } else {
                content.classList.add('active');
            }
        }

        function renderStaticPage(pageId) {
            if (pageId === 'links' || pageId === 'credits') {
                mainContent.innerHTML = getResourcesHtml(pageId);
                window.location.hash = 'resources';
            }
        }

        function render() {
            const hash = window.location.hash.replace('#', '') || 'home';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (appsConfig[hash]) {
                mainContent.innerHTML = appsConfig[hash].html[currentLang]();
            } else if (hash === 'apps') {
                mainContent.innerHTML = getHomeHtml();
                const el = document.getElementById('apps');
                if(el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 100);
            } else if (hash === 'resources') {
                // Si on est sur la page resources mais qu'on n'a pas cliqué sur un bouton du menu, on affiche les liens
                mainContent.innerHTML = getResourcesHtml('links');
            } else if (hash === 'support') {
                mainContent.innerHTML = getSupportHtml();
            } else if (hash === 'contact') {
                mainContent.innerHTML = getContactHtml();
                setupContactForm();
            } else if (hash === 'privacy') {
                mainContent.innerHTML = getPrivacyHtml();
            } else {
                mainContent.innerHTML = getHomeHtml();
            }
        }

        // ==========================================
        // 5. CONTACT FORM LOGIC
        // ==========================================
        function setupContactForm() {
            const form = document.getElementById('contactForm');
            if (!form) return;
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const submitBtn = document.getElementById('submitBtn');
                const status = document.getElementById('formStatus');
                const formData = new FormData(form);
                submitBtn.textContent = t('contact_sending');
                submitBtn.disabled = true;
                status.className = '';
                status.textContent = '';
                try {
                    const response = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (data.success) {
                        status.className = 'alert alert-success';
                        status.textContent = t('contact_success');
                        form.reset();
                    } else {
                        status.className = 'alert alert-error';
                        status.textContent = t('contact_error');
                    }
                } catch (error) {
                    status.className = 'alert alert-error';
                    status.textContent = t('contact_error');
                } finally {
                    submitBtn.textContent = t('contact_send');
                    submitBtn.disabled = false;
                }
            });
        }

        window.addEventListener('hashchange', render);
        
        // Applique la langue sauvegardée au chargement
        setLanguage(currentLang);
    </script>
